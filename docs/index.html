<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Voorraad, kastlijsten en bestellijst voor de meubelonderdelen van PUUUR.">
<link rel="icon" href="img/favicon.svg">
<style>
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body { margin: 0; font: 14px system-ui, sans-serif; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Onderdelenbeheer Puuur</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">
<style>
  :root {
    --paper: #ffffff;
    --wash: #faf8f3;
    --ink: #15140f;
    --ink-2: #6b665b;
    --ink-3: #8f8a7e;
    --line: #e4e0d6;
    --line-2: #cfc9bb;
    --gold: #9a7722;
    --gold-line: #d7c289;
    --gold-wash: #f8f1dd;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  :root:not([data-theme="light"]) { color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #131210;
      --wash: #1a1816;
      --ink: #f3efe5;
      --ink-2: #a09a8c;
      --ink-3: #837d70;
      --line: #2c2a25;
      --line-2: #3d3a33;
      --gold: #d9b661;
      --gold-line: #5c4d26;
      --gold-wash: #221e16;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #131210;
    --wash: #1a1816;
    --ink: #f3efe5;
    --ink-2: #a09a8c;
    --ink-3: #837d70;
    --line: #2c2a25;
    --line-2: #3d3a33;
    --gold: #d9b661;
    --gold-line: #5c4d26;
    --gold-wash: #221e16;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14.5px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0; }
  button { font: inherit; color: inherit; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  .muted { color: var(--ink-2); }
  .faint { color: var(--ink-3); }

  /* ---------------------------------------------------------- raamwerk */
  .page { max-width: 1020px; margin: 0 auto; padding-inline: 20px; }
  header.top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .bar {
    max-width: 1020px;
    margin: 0 auto;
    padding: 16px 20px 12px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }
  .mark { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
  .mark span { color: var(--gold); letter-spacing: 0.16em; font-weight: 600; }
  .bar .who { margin-left: auto; display: flex; align-items: baseline; gap: 8px; }
  .eyebrow {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.13em;
    color: var(--ink-3);
    font-weight: 600;
  }
  select#who {
    font: inherit;
    font-size: 13.5px;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 3px 8px;
    border-radius: 0;
  }
  nav.tabs {
    max-width: 1020px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    gap: 22px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    padding: 4px 0 10px;
    cursor: pointer;
    color: var(--ink-2);
    font-size: 14px;
    white-space: nowrap;
  }
  nav.tabs button:hover { color: var(--ink); }
  nav.tabs button[aria-current="true"] { color: var(--ink); border-bottom-color: var(--gold); font-weight: 500; }
  nav.tabs .count { font-family: var(--mono); font-size: 11.5px; color: var(--gold); margin-left: 4px; }
  main { padding-block: 26px 90px; }

  /* ---------------------------------------------------------- bouwstenen */
  section { margin-top: 38px; }
  section:first-child { margin-top: 0; }
  .head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .head h2 { font-size: 16px; }
  .head .right { margin-left: auto; display: flex; gap: 14px; align-items: baseline; }

  .btn {
    background: none;
    border: 1px solid var(--line-2);
    padding: 7px 14px;
    cursor: pointer;
    font-size: 13.5px;
    border-radius: 0;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink); }
  .btn.solid { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .btn.solid:hover { opacity: 0.86; }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: #17160f; font-weight: 500; }
  .btn.gold:hover { opacity: 0.88; }
  .btn.lg { padding: 12px 22px; font-size: 15px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .link {
    background: none; border: 0; padding: 0; cursor: pointer;
    font-size: 13.5px; color: var(--ink-2); border-bottom: 1px solid var(--line-2);
  }
  .link:hover { color: var(--ink); border-bottom-color: var(--gold); }

  .chip {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border: 1px solid var(--line-2);
    color: var(--ink-2);
    white-space: nowrap;
  }
  .chip.mist { border-color: var(--gold-line); background: var(--gold-wash); color: var(--gold); font-weight: 600; }
  .chip.klaar { border-color: var(--ink); background: var(--ink); color: var(--paper); font-weight: 600; }

  input[type="text"], input[type="search"], input[type="number"], textarea, select.f {
    font: inherit;
    font-size: 14px;
    width: 100%;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line-2);
    border-radius: 0;
    padding: 8px 10px;
  }
  input:focus, textarea:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }
  textarea { min-height: 64px; resize: vertical; }
  label.f { display: block; }
  label.f > span { display: block; margin-bottom: 4px; }
  .grid2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .grid2 .wide { grid-column: 1 / -1; }

  .search { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line-2); padding-bottom: 6px; }
  .search input { border: 0; padding: 4px 0; background: none; }
  .search input:focus { outline: none; }
  .search .ico { color: var(--ink-3); font-size: 13px; }

  .tools { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; margin-bottom: 18px; }
  .tools .spacer { margin-left: auto; }

  /* ---------------------------------------------------------- tabellen */
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-3);
    font-weight: 600;
    padding: 0 10px 7px 0;
    border-bottom: 1px solid var(--line-2);
    white-space: nowrap;
  }
  th.num { text-align: right; }
  td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
  td:last-child, th:last-child { padding-right: 0; }
  .thumb {
    width: 46px; height: 34px; object-fit: cover;
    background: var(--wash); border: 1px solid var(--line); display: block;
  }
  .thumb.groot { width: 60px; height: 46px; }
  .name { font-weight: 500; }
  .code { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
  .cell { display: flex; align-items: center; gap: 11px; min-width: 210px; }
  .loc { font-family: var(--mono); font-size: 13px; }

  /* ---------------------------------------------------------- rijen */
  .rows { border-top: 1px solid var(--line); }
  .row {
    display: flex; align-items: center; gap: 14px;
    padding: 13px 0; border-bottom: 1px solid var(--line);
  }
  .row .grow { flex: 1; min-width: 0; }
  .row.click { cursor: pointer; }
  .row.click:hover { background: var(--wash); }
  .kast { font-family: var(--mono); font-size: 17px; font-weight: 600; letter-spacing: 0.02em; }
  .kast small { display: block; font-size: 9.5px; letter-spacing: 0.14em; color: var(--ink-3); font-weight: 500; }
  .kast.groot { font-size: 24px; }

  .step { display: inline-flex; border: 1px solid var(--line-2); }
  .step button { width: 32px; height: 34px; background: none; border: 0; cursor: pointer; color: var(--ink-2); font-size: 16px; }
  .step button:hover { color: var(--ink); background: var(--wash); }
  .step span { width: 42px; height: 34px; display: grid; place-items: center; font-family: var(--mono); border-inline: 1px solid var(--line); }

  .tick {
    width: 34px; height: 34px; border: 1px solid var(--line-2); background: none;
    cursor: pointer; display: grid; place-items: center; color: var(--line-2); flex: none;
  }
  .tick:hover { border-color: var(--gold); }
  .tick.on { background: var(--gold); border-color: var(--gold); color: #17160f; }
  .tick svg { width: 18px; height: 18px; }

  /* ---------------------------------------------------------- pakken */
  .pakrij { display: flex; align-items: center; gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .pakrij:first-child { border-top: 1px solid var(--line); }
  .pakrij .grow { flex: 1; min-width: 140px; }
  .pakrij .nm { font-size: 15.5px; font-weight: 500; }
  .aantal { font-family: var(--mono); font-size: 20px; min-width: 46px; text-align: right; }
  .aantal small { display: block; font-size: 9.5px; letter-spacing: 0.1em; color: var(--ink-3); text-transform: uppercase; }
  .pakrij.mist { background: var(--gold-wash); }

  .vraag {
    position: sticky; bottom: 0; background: var(--paper);
    border-top: 1px solid var(--line-2);
    padding: 16px 0 calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    margin-top: 10px;
  }
  .vraag .tekst { font-size: 15.5px; font-weight: 500; }
  .vraag .spacer { margin-left: auto; }

  /* ---------------------------------------------------------- tellen */
  .telrij { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .telrij:first-child { border-top: 1px solid var(--line); }
  .telrij .grow { flex: 1; min-width: 150px; }
  .telrij .nm { font-weight: 500; }
  .telrij.geteld { background: var(--wash); }
  .tekortkleur { color: var(--gold); font-weight: 600; }
  .telrij.tekort { background: var(--gold-wash); box-shadow: inset 2px 0 0 var(--gold); }
  .telstand { font-family: var(--mono); font-size: 12px; color: var(--ink-3); text-align: right; min-width: 132px; }
  input.telveld {
    width: 92px; text-align: right; font-family: var(--mono); font-size: 16px;
    appearance: textfield; -moz-appearance: textfield;
  }
  input.telveld::-webkit-outer-spin-button,
  input.telveld::-webkit-inner-spin-button { appearance: none; margin: 0; }
  .eenheid { font-size: 12.5px; min-width: 44px; }

  /* ---------------------------------------------------------- venster */
  .veil {
    position: fixed; inset: 0; background: rgba(10, 9, 7, 0.55);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 5vh 16px; overflow-y: auto; z-index: 50;
  }
  .panel { background: var(--paper); border: 1px solid var(--line-2); width: 100%; max-width: 560px; }
  .panel.wide { max-width: 720px; }
  .panel h2 { font-size: 16px; }
  .panel .ph { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .panel .pb { padding: 18px 20px; display: grid; gap: 14px; }
  .panel .pf { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--wash); }
  .x { margin-left: auto; background: none; border: 0; cursor: pointer; color: var(--ink-2); font-size: 18px; line-height: 1; padding: 4px; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    background: var(--ink); color: var(--paper);
    padding: 10px 18px; font-size: 13.5px; z-index: 60;
  }

  .empty { padding: 30px 0; color: var(--ink-3); font-size: 14px; }
  .note { border-left: 2px solid var(--gold); padding: 8px 0 8px 14px; margin-bottom: 22px; font-size: 14px; }
  .note b { font-weight: 600; }

  @media (max-width: 620px) {
    .telrij { flex-wrap: wrap; }
    .telstand { min-width: 0; order: 3; }
    .pakrij { flex-wrap: wrap; }
    .pakrij .grow { flex-basis: 55%; }
    .vraag { flex-direction: column; align-items: stretch; }
    .vraag .spacer { display: none; }
    .vraag .btn { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="mark">Onderdelenbeheer <span>PUUUR</span></div>
    <div class="who">
      <label class="eyebrow" for="who">Ingelogd als</label>
      <select id="who"></select>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Schermen"></nav>
</header>
<div class="page"><main id="view"></main></div>
<div id="overlay"></div>
<div id="toast" hidden class="toast"></div>

<script>
(() => {
  const MENSEN = ['Roy', 'Dean'];
  const TABBLADEN = {
    Roy: [['maken', 'Kastlijst maken'], ['bestellen', 'Te bestellen']],
    Dean: [['kastlijsten', 'Kastlijsten'], ['voorraad', 'Voorraad']],
  };
  const LEEG = 'img/placeholder.svg';

  const S = {
    db: null, assets: null, klaar: false, lokaal: false,
    parts: [], lists: [],
    wie: 'Roy', tab: 'maken',
    lijstId: null,     // kastlijst die bekeken of gepakt wordt
    telZoek: '',       // zoekterm op het voorraadscherm
    mist: null,        // tijdens "er mist iets": { partId: aantal }
    concept: null,     // kastlijst in de maak
  };

  try { S.wie = localStorage.getItem('wie') === 'Dean' ? 'Dean' : 'Roy'; } catch (e) { /* privémodus */ }
  S.tab = TABBLADEN[S.wie][0][0];

  /* ------------------------------------------------------------ opslag */

  const docs = (snap) => snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  const nu = () => new Date().toISOString();

  /**
   * Opslag op dit apparaat. Wordt gebruikt als de site als gewone website
   * draait; binnen Claude praat de pagina met de gedeelde opslag. Dezelfde
   * functies, zodat de rest van het programma niets hoeft te weten.
   */
  function lokaleOpslag() {
    const SLEUTEL = 'onderdelenbeheer-puuur';
    const leeg = () => ({ parts: {}, lists: {} });
    let data = leeg();
    try { data = Object.assign(leeg(), JSON.parse(localStorage.getItem(SLEUTEL) || '{}')); } catch (e) { /* privémodus */ }
    const luisteraars = [];

    const bewaar = () => {
      try { localStorage.setItem(SLEUTEL, JSON.stringify(data)); } catch (e) { meld('Het geheugen van deze browser zit vol.'); }
      luisteraars.forEach((fn) => fn());
    };
    const snapDoc = (col, id) => ({ id, exists: Boolean((data[col] || {})[id]), data: () => (data[col] || {})[id], metadata: {} });
    const nieuwId = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    const docRef = (col, id) => ({
      id,
      path: col + '/' + id,
      get: async () => snapDoc(col, id),
      set: async (d) => { data[col][id] = JSON.parse(JSON.stringify(d)); bewaar(); },
      update: async (d) => { data[col][id] = { ...(data[col][id] || {}), ...JSON.parse(JSON.stringify(d)) }; bewaar(); },
      delete: async () => { delete data[col][id]; bewaar(); },
      onSnapshot(next) {
        const fn = () => next(snapDoc(col, id));
        luisteraars.push(fn);
        setTimeout(fn, 0);
        return () => {};
      },
    });

    return {
      lokaal: true,
      collection: (col) => ({
        onSnapshot(next) {
          const fn = () => next({ docs: Object.keys(data[col] || {}).map((id) => snapDoc(col, id)) });
          luisteraars.push(fn);
          setTimeout(fn, 0);
          return () => {};
        },
        doc: (id) => docRef(col, id || nieuwId()),
        add: async (d) => { const id = nieuwId(); data[col][id] = JSON.parse(JSON.stringify(d)); bewaar(); return docRef(col, id); },
      }),
      doc: (pad) => { const [col, id] = pad.split('/'); return docRef(col, id); },
      alles: () => data,
      vervangAlles: (nieuw) => { data = Object.assign(leeg(), nieuw); bewaar(); },
      isLeeg: () => !Object.keys(data.parts || {}).length,
    };
  }

  /** De eerste keer vullen met de onderdelenlijst die naast de pagina staat. */
  async function vulEersteKeer(opslag) {
    if (!opslag.isLeeg()) return;
    try {
      const antwoord = await fetch('gegevens.json', { cache: 'no-store' });
      if (!antwoord.ok) return;
      opslag.vervangAlles(await antwoord.json());
    } catch (e) { /* zonder startlijst begint het programma leeg */ }
  }

  async function start() {
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
    try { S.assets = window.claude && window.claude.use ? await window.claude.use('assets') : null; } catch (e) { S.assets = null; }
    if (!db) {
      db = lokaleOpslag();
      S.lokaal = true;
      await vulEersteKeer(db);
    }
    S.db = db;
    db.collection('parts').onSnapshot((s) => { S.parts = docs(s); S.klaar = true; teken(); });
    db.collection('lists').onSnapshot((s) => { S.lists = docs(s); teken(); });
  }

  async function schrijf(actie, melding) {
    try {
      await actie();
      if (melding) meld(melding);
    } catch (e) {
      meld('Opslaan is niet gelukt. Probeer het opnieuw.');
    }
  }

  const partRef = (id) => S.db.doc('parts/' + id);
  const listRef = (id) => S.db.doc('lists/' + id);

  /* ------------------------------------------------------------ gegevens */

  /** Locatienummer als sorteersleutel: 9 komt vóór 11, 11-2 vlak na 11. */
  function locatieSleutel(locatie) {
    const tekst = String(locatie || '').trim();
    const eerste = tekst.match(/^(\d+)(.*)$/);
    return eerste ? [Number(eerste[1]), eerste[2]] : [Number.POSITIVE_INFINITY, tekst];
  }

  function opLocatie(a, b) {
    const [na, ra] = locatieSleutel(a.location);
    const [nb, rb] = locatieSleutel(b.location);
    if (na !== nb) return na - nb;
    if (ra !== rb) return ra.localeCompare(rb, 'nl');
    return (a.name || '').localeCompare(b.name || '', 'nl');
  }

  const onderdelen = () => S.parts.slice().sort(opLocatie);
  const partById = (id) => S.parts.find((p) => p.id === id);
  const lijstById = (id) => S.lists.find((l) => l.id === id);
  const openLijsten = () => S.lists.filter((l) => l.status === 'open')
    .sort((a, b) => (a.cabinetNumber || '').localeCompare(b.cabinetNumber || '', 'nl', { numeric: true }));
  const afgerondeLijsten = () => S.lists.filter((l) => l.status !== 'open')
    .sort((a, b) => (b.completedAt || '').localeCompare(a.completedAt || ''));

  /** Wat Dean gemeld heeft en Roy nog moet bestellen, per onderdeel. */
  function teBestellen() {
    const perOnderdeel = new Map();
    for (const lijst of S.lists) {
      for (const regel of lijst.lines || []) {
        if (!(regel.missingQty > 0) || regel.missingHandled) continue;
        const bestaand = perOnderdeel.get(regel.partId) || { aantal: 0, kasten: [] };
        bestaand.aantal += regel.missingQty;
        bestaand.kasten.push({ nummer: lijst.cabinetNumber, aantal: regel.missingQty, at: lijst.completedAt, door: lijst.completedBy });
        perOnderdeel.set(regel.partId, bestaand);
      }
    }
    return [...perOnderdeel.entries()]
      .map(([partId, gegevens]) => ({ part: partById(partId), ...gegevens }))
      .filter((r) => r.part)
      .sort((a, b) => opLocatie(a.part, b.part));
  }

  function zoeken(term, lijst) {
    const vraag = (term || '').trim().toLowerCase();
    if (!vraag) return lijst;
    const woorden = vraag.split(/\s+/);
    return lijst.filter((p) => {
      const hooi = `${p.number} ${p.name} ${p.category} ${p.supplier} ${p.location}`.toLowerCase();
      return woorden.every((w) => hooi.includes(w));
    });
  }

  /* ------------------------------------------------------------ opmaak */

  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const datum = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    const n = new Date();
    if (d.toDateString() === n.toDateString()) return 'vandaag ' + d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
    if (new Date(n.getTime() - 864e5).toDateString() === d.toDateString()) return 'gisteren';
    return d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
  };

  const foto = (p, klas) => `<img class="thumb ${klas || ''}" src="${esc((p && p.photo) || LEEG)}" alt="" loading="lazy">`;
  const kort = (p) => p.number || '';
  const plek = (p) => (p.location ? 'locatie ' + p.location : 'geen locatie');
  const rest = (p) => (isGeteld(p)
    ? (p.stock < 0 ? `${p.stock} — te weinig` : `nog ${p.stock}`)
    : 'nog niet geteld');

  const cel = (p) => `<div class="cell">${foto(p)}<div><div class="name">${esc(p.name)}</div>
    <div class="code">${esc([kort(p), p.location ? 'loc. ' + p.location : ''].filter(Boolean).join(' · '))}</div></div></div>`;

  const staatChip = (l) => l.status === 'open' ? '<span class="chip">Klaar om te pakken</span>'
    : l.status === 'tekort' ? '<span class="chip mist">Tekort gemeld</span>'
    : '<span class="chip klaar">Compleet</span>';

  /* ------------------------------------------------------------ Roy: kastlijst maken */

  function schermMaken() {
    if (S.lijstId) return schermLijstBekijken();
    if (!S.concept) S.concept = { cabinetNumber: '', title: '', lines: [], zoek: '', id: null };
    const c = S.concept;
    const gevonden = zoeken(c.zoek, onderdelen()).slice(0, 30);
    const totaal = c.lines.reduce((s, r) => s + r.qty, 0);
    const eerder = S.lists.slice().sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));

    return `
      <section>
        <div class="head"><h2>${c.id ? 'Kastlijst wijzigen' : 'Nieuwe kastlijst'}</h2>
          ${c.id ? '<div class="right"><button class="link" data-act="conceptweg">Wijzigen stoppen</button></div>' : ''}</div>
        <div class="grid2" style="max-width:620px">
          <label class="f"><span class="eyebrow">Kastnummer</span>
            <input id="kastnr" type="text" inputmode="numeric" value="${esc(c.cabinetNumber)}" placeholder="14925"></label>
          <label class="f"><span class="eyebrow">Omschrijving</span>
            <input id="kasttitel" type="text" value="${esc(c.title)}" placeholder="Mitchell"></label>
        </div>
      </section>

      <section>
        <div class="head"><h2>Onderdelen zoeken</h2>
          <div class="right"><button class="link" data-act="nieuwonderdeel">Onderdeel toevoegen</button></div></div>
        <div class="search" style="max-width:420px"><span class="ico">zoek</span>
          <input id="zoek" type="search" value="${esc(c.zoek)}" placeholder="naam, nummer, locatie of leverancier"></div>
        <div class="rows" style="margin-top:14px" id="zoekresultaat">${zoekRijen(gevonden)}</div>
      </section>

      <section>
        <div class="head"><h2>Op de lijst</h2>
          <div class="right faint">${c.lines.length} regels · ${totaal} stuks</div></div>
        ${c.lines.length ? `<div class="rows">${c.lines.map((r) => {
          const p = partById(r.partId) || { name: 'Onbekend onderdeel' };
          const teweinig = isGeteld(p) && p.stock < 0;
          return `<div class="row">${foto(p)}
            <div class="grow"><div class="name">${esc(p.name)}</div>
              <div class="code ${teweinig ? 'tekortkleur' : ''}">${esc([kort(p), plek(p), rest(p)].filter(Boolean).join(' · '))}</div></div>
            <div class="step"><button data-act="min:${r.partId}">−</button><span>${r.qty}</span>
              <button data-act="plus:${r.partId}">+</button></div>
            <button class="link" data-act="weg:${r.partId}">weg</button></div>`;
        }).join('')}</div>
        <div class="vraag">
          <span class="faint">Dean ziet deze lijst zodra je hem opslaat.</span>
          <div class="spacer"></div>
          <button class="btn solid lg" data-act="bewaar">${c.id ? 'Wijzigingen opslaan' : 'Kastlijst opslaan'}</button>
        </div>` : '<p class="empty">Zoek hierboven een onderdeel en klik op toevoegen.</p>'}
      </section>

      <section>
        <div class="head"><h2>Gemaakte kastlijsten</h2></div>
        ${eerder.length ? `<div class="rows">${eerder.map((l) => `<div class="row click" data-act="open:${l.id}">
          <div class="kast"><small>KAST</small>${esc(l.cabinetNumber)}</div>
          <div class="grow"><div class="name">${esc(l.title || 'Kastlijst')}</div>
            <div class="code">${(l.lines || []).length} onderdelen${l.completedAt ? ' · gepakt door ' + esc(l.completedBy || '') + ' ' + datum(l.completedAt) : ' · gemaakt ' + datum(l.createdAt)}</div></div>
          ${staatChip(l)}</div>`).join('')}</div>`
        : '<p class="empty">Nog geen kastlijsten gemaakt.</p>'}
      </section>`;
  }

  function zoekRijen(lijst) {
    if (!lijst.length) return '<p class="empty">Niets gevonden.</p>';
    return lijst.map((p) => {
      const opLijst = S.concept.lines.find((r) => r.partId === p.id);
      return `<div class="row">${foto(p)}
        <div class="grow"><div class="name">${esc(p.name)}</div>
          <div class="code">${esc([kort(p), plek(p)].filter(Boolean).join(' · '))}</div></div>
        <span class="code ${isGeteld(p) && p.stock < 0 ? 'tekortkleur' : ''}">${esc(rest(p))}</span>
        ${opLijst ? `<span class="chip">${opLijst.qty} op lijst</span>` : ''}
        <button class="btn" data-act="voeg:${p.id}">Toevoegen</button>
        <button class="link" data-act="wijzigonderdeel:${p.id}">wijzig</button></div>`;
    }).join('');
  }

  function schermLijstBekijken() {
    const l = lijstById(S.lijstId);
    if (!l) return '<p class="empty">Kastlijst niet gevonden.</p>';
    const regels = (l.lines || []).map((r) => ({ regel: r, part: partById(r.partId) }))
      .filter((x) => x.part)
      .sort((a, b) => opLocatie(a.part, b.part));
    const mist = regels.filter((x) => x.regel.missingQty > 0);

    return `
      <button class="link" data-act="terug" style="margin-bottom:18px">← Terug</button>
      ${mist.length ? `<div class="note"><b>Dean kwam tekort:</b> ${mist
        .map((x) => `${x.regel.missingQty} × ${esc(x.part.name)}`).join(', ')}</div>` : ''}
      <div class="row" style="border-top:1px solid var(--line)">
        <div class="kast groot"><small>KAST</small>${esc(l.cabinetNumber)}</div>
        <div class="grow"><div class="name" style="font-size:16px">${esc(l.title || 'Kastlijst')}</div>
          <div class="code">Gemaakt door ${esc(l.createdBy || '')} ${datum(l.createdAt)}${
            l.completedAt ? ` · gepakt door ${esc(l.completedBy || '')} ${datum(l.completedAt)}` : ''}</div></div>
        ${staatChip(l)}
      </div>
      <div class="scroll" style="margin-top:18px"><table><thead><tr>
        <th>Onderdeel</th><th>Locatie</th><th class="num">Aantal</th><th class="num">Mist</th>
      </tr></thead><tbody>${regels.map((x) => `<tr>
        <td>${cel(x.part)}</td>
        <td class="loc">${esc(x.part.location || '–')}</td>
        <td class="num">${x.regel.qty}</td>
        <td class="num">${x.regel.missingQty ? `<span class="chip mist">${x.regel.missingQty}</span>` : '<span class="faint">–</span>'}</td>
      </tr>`).join('')}</tbody></table></div>
      ${l.status === 'open' ? `<div class="tools" style="margin-top:20px">
        <button class="btn" data-act="wijziglijst:${l.id}">Kastlijst wijzigen</button>
        <button class="link" data-act="verwijderlijst:${l.id}">Verwijderen</button></div>` : ''}`;
  }

  /* ------------------------------------------------------------ Roy: te bestellen */

  function schermBestellen() {
    const rijen = teBestellen();
    if (!rijen.length) {
      return `<section><div class="head"><h2>Te bestellen</h2></div>
        <p class="empty">Er staat niets open. Zodra Dean bij een kast onderdelen tekort komt, verschijnt het hier.</p></section>`;
    }
    return `
      <section>
        <div class="head"><h2>Te bestellen</h2>
          <div class="right faint">${rijen.length} onderdelen · gemeld uit de werkplaats</div></div>
        <div class="scroll"><table><thead><tr>
          <th>Onderdeel</th><th>Locatie</th><th>Leverancier</th><th>Gemeld bij</th><th class="num">Aantal</th><th></th>
        </tr></thead><tbody>${rijen.map((r) => `<tr>
          <td>${cel(r.part)}</td>
          <td class="loc">${esc(r.part.location || '–')}</td>
          <td style="font-size:13.5px">${esc(r.part.supplier || '–')}</td>
          <td class="faint" style="font-size:13px">${r.kasten.map((k) => `kast ${esc(k.nummer)} (${k.aantal})`).join(', ')}</td>
          <td class="num" style="font-weight:600">${r.aantal}</td>
          <td style="text-align:right"><button class="link" data-act="afgehandeld:${r.part.id}">afgehandeld</button></td>
        </tr>`).join('')}</tbody></table></div>
      </section>`;
  }

  /* ------------------------------------------------------------ Dean */

  function schermKastlijsten() {
    if (S.lijstId && S.mist) return schermMist();
    if (S.lijstId) return schermPakken();
    const open = openLijsten();
    const klaar = afgerondeLijsten().slice(0, 5);
    return `
      <section>
        <div class="head"><h2>Welke kast ga je maken?</h2></div>
        ${open.length ? `<div class="rows">${open.map((l) => `<div class="row click" data-act="pak:${l.id}">
          <div class="kast groot"><small>KAST</small>${esc(l.cabinetNumber)}</div>
          <div class="grow"><div class="name" style="font-size:16px">${esc(l.title || 'Kastlijst')}</div>
            <div class="code">${(l.lines || []).length} onderdelen · ${(l.lines || []).reduce((s, r) => s + r.qty, 0)} stuks</div></div>
          <span class="chip">Klaar om te pakken</span></div>`).join('')}</div>`
        : '<p class="empty">Er staat geen kastlijst klaar. Roy maakt ze aan.</p>'}
      </section>
      ${klaar.length ? `<section><div class="head"><h2>Laatst afgerond</h2></div>
        <div class="rows">${klaar.map((l) => `<div class="row click" data-act="bekijk:${l.id}">
          <div class="kast"><small>KAST</small>${esc(l.cabinetNumber)}</div>
          <div class="grow"><div class="name">${esc(l.title || 'Kastlijst')}</div>
            <div class="code">${esc(l.completedBy || '')} · ${datum(l.completedAt)}</div></div>
          ${staatChip(l)}</div>`).join('')}</div></section>` : ''}`;
  }

  /** Alles wat er voor deze kast nodig is, op volgorde van locatie. */
  function pakRegels(l) {
    return (l.lines || []).map((r) => ({ regel: r, part: partById(r.partId) }))
      .filter((x) => x.part)
      .sort((a, b) => opLocatie(a.part, b.part));
  }

  function schermPakken() {
    const l = lijstById(S.lijstId);
    if (!l) return '<p class="empty">Kastlijst niet gevonden.</p>';
    if (l.status !== 'open') return schermLijstBekijken();
    const regels = pakRegels(l);

    return `
      <button class="link" data-act="terug" style="margin-bottom:18px">← Andere kast</button>
      <div class="row" style="border-top:1px solid var(--line)">
        <div class="kast groot"><small>KAST</small>${esc(l.cabinetNumber)}</div>
        <div class="grow"><div class="name" style="font-size:16px">${esc(l.title || 'Kastlijst')}</div>
          ${l.note ? `<div class="code">${esc(l.note)}</div>` : ''}</div>
        <div class="mono faint">${regels.reduce((s, x) => s + x.regel.qty, 0)} stuks</div>
      </div>
      ${regels.map((x) => `<div class="pakrij">
        ${foto(x.part, 'groot')}
        <div class="grow"><div class="nm">${esc(x.part.name)}</div>
          <div class="code">${esc([kort(x.part), plek(x.part)].filter(Boolean).join(' · '))}</div></div>
        <div class="aantal">${x.regel.qty}<small>${esc(x.part.unit || 'stuks')}</small></div>
      </div>`).join('')}
      <div class="vraag">
        <span class="tekst">Heb je alle onderdelen?</span>
        <div class="spacer"></div>
        <button class="btn lg" data-act="nee">Nee, er mist iets</button>
        <button class="btn gold lg" data-act="ja">Ja, alles compleet</button>
      </div>`;
  }

  function schermMist() {
    const l = lijstById(S.lijstId);
    if (!l) return '<p class="empty">Kastlijst niet gevonden.</p>';
    const regels = pakRegels(l);
    const gekozen = Object.keys(S.mist).length;

    return `
      <button class="link" data-act="terugpakken" style="margin-bottom:18px">← Terug naar de lijst</button>
      <div class="row" style="border-top:1px solid var(--line)">
        <div class="kast groot"><small>KAST</small>${esc(l.cabinetNumber)}</div>
        <div class="grow"><div class="name" style="font-size:16px">Wat mist er?</div>
          <div class="code">Vink aan wat je niet kon pakken en hoeveel.</div></div>
      </div>
      ${regels.map((x) => {
        const aan = S.mist[x.part.id] !== undefined;
        return `<div class="pakrij ${aan ? 'mist' : ''}">
          <button class="tick ${aan ? 'on' : ''}" data-act="vink:${x.part.id}" aria-label="${esc(x.part.name)} mist">
            <svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9.5 17 4 11.5" stroke="currentColor" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          ${foto(x.part)}
          <div class="grow"><div class="nm">${esc(x.part.name)}</div>
            <div class="code">${esc([kort(x.part), plek(x.part)].filter(Boolean).join(' · '))}</div></div>
          <div class="aantal">${x.regel.qty}<small>nodig</small></div>
          ${aan ? `<div class="step"><button data-act="mistmin:${x.part.id}">−</button>
            <span>${S.mist[x.part.id]}</span><button data-act="mistplus:${x.part.id}">+</button></div>`
            : '<div style="width:108px"></div>'}
        </div>`;
      }).join('')}
      <div class="vraag">
        <span class="tekst">${gekozen ? `${gekozen} ${gekozen === 1 ? 'onderdeel' : 'onderdelen'} aangevinkt` : 'Vink aan wat er mist'}</span>
        <div class="spacer"></div>
        <button class="btn solid lg" data-act="doorgeven" ${gekozen ? '' : 'disabled'}>Doorgeven aan Roy</button>
      </div>`;
  }

  /* ------------------------------------------------------------ Dean: voorraad */

  // Geteld is het pas als iemand het echt geteld heeft: oude gegevens waarin
  // een aantal op nul stond tellen niet mee.
  const isGeteld = (p) => Boolean(p.countedAt) && typeof p.stock === 'number';

  function schermVoorraad() {
    const alles = onderdelen();
    const lijst = zoeken(S.telZoek, alles);
    const geteld = alles.filter(isGeteld).length;
    const laatste = alles.map((p) => p.countedAt).filter(Boolean).sort().pop();

    return `
      <section>
        <div class="head"><h2>Voorraad</h2>
          <div class="right faint">${geteld} van ${alles.length} geteld${laatste ? ' · laatst bijgewerkt ' + datum(laatste) : ''}</div></div>
        <p class="faint" style="margin-bottom:16px">Tel aan het begin één keer alles: loop de stellingen langs op volgorde van
          locatie en vul in hoeveel er ligt. Elk aantal wordt meteen bewaard. Daarna houdt het programma het zelf bij —
          wat Roy op een kastlijst zet, gaat er meteen af.</p>
        <div class="search" style="max-width:420px"><span class="ico">zoek</span>
          <input id="zoekvoorraad" type="search" value="${esc(S.telZoek)}" placeholder="naam, nummer of locatie"></div>
        <div style="margin-top:14px" id="telrijen">${telRijen(lijst)}</div>
      </section>`;
  }

  function telRijen(lijst) {
    if (!lijst.length) return '<p class="empty">Niets gevonden.</p>';
    return lijst.map((p) => `<div class="telrij ${isGeteld(p) ? 'geteld' : ''}${isGeteld(p) && p.stock < 0 ? ' tekort' : ''}" id="tel_${esc(p.id)}">
      ${foto(p)}
      <div class="grow"><div class="nm">${esc(p.name)}</div>
        <div class="code">${esc([kort(p), plek(p)].filter(Boolean).join(' · '))}</div></div>
      <div class="telstand ${isGeteld(p) && p.stock < 0 ? 'tekortkleur' : ''}">${telStand(p)}</div>
      <input class="telveld" type="number" min="0" inputmode="numeric" data-tel="${esc(p.id)}"
        value="${isGeteld(p) ? p.stock : ''}" aria-label="Aantal ${esc(p.name)}">
      <span class="eenheid faint">${esc(p.unit || 'stuks')}</span>
    </div>`).join('');
  }

  const telStand = (p) => {
    if (!p.countedAt) return 'nog niet geteld';
    const geteld = `geteld ${datum(p.countedAt)}${p.countedBy ? ' · ' + esc(p.countedBy) : ''}`;
    return p.stock < 0 ? `te weinig · ${geteld}` : geteld;
  };

  /** Eén aantal bewaren; het scherm blijft staan waar Dean gebleven was. */
  async function bewaarAantal(partId, tekst) {
    const p = partById(partId);
    if (!p) return;
    const leeg = String(tekst).trim() === '';
    const aantal = leeg ? null : Math.max(0, Math.round(Number(tekst) || 0));
    await schrijf(async () => {
      await partRef(partId).update(leeg
        ? { stock: null, countedAt: null, countedBy: null }
        : { stock: aantal, countedAt: nu(), countedBy: S.wie });
    });
    const rij = document.getElementById('tel_' + partId);
    if (rij) {
      rij.classList.toggle('geteld', !leeg);
      rij.classList.toggle('tekort', !leeg && aantal < 0);
      const stand = rij.querySelector('.telstand');
      if (stand) stand.textContent = leeg ? 'nog niet geteld' : `geteld ${datum(nu())} · ${S.wie}`;
    }
    const teller = document.querySelector('#view .head .right');
    if (teller) {
      const alles = onderdelen();
      teller.textContent = `${alles.filter(isGeteld).length} van ${alles.length} geteld · laatst bijgewerkt ${datum(nu())}`;
    }
  }

  /* ------------------------------------------------------------ tekenen */

  function teken(force) {
    // Tijdens het tellen houdt het voorraadscherm zichzelf bij: opnieuw
    // tekenen zou de cursor uit het vakje halen waar Dean net in typt.
    if (!force && S.wie === 'Dean' && S.tab === 'voorraad' && document.getElementById('telrijen')) return;
    if (!force && document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
      S.hertekenen = true;
      return;
    }
    S.hertekenen = false;
    const view = document.getElementById('view');
    if (!S.klaar) { view.innerHTML = '<p class="empty">Gegevens laden…</p>'; tekenTabs(); return; }

    const scherm = S.wie === 'Dean'
      ? (S.tab === 'voorraad' ? schermVoorraad() : schermKastlijsten())
      : S.tab === 'bestellen' ? schermBestellen()
      : schermMaken();
    view.innerHTML = scherm;
    tekenTabs();
  }

  function tekenTabs() {
    const tabs = TABBLADEN[S.wie] || [];
    const tellers = { bestellen: S.klaar ? teBestellen().length : 0, kastlijsten: S.klaar ? openLijsten().length : 0 };
    const nav = document.getElementById('tabs');
    nav.hidden = tabs.length < 2;
    nav.innerHTML = tabs.map(([sleutel, naam]) =>
      `<button data-act="tab:${sleutel}" aria-current="${S.tab === sleutel}">${naam}${
        tellers[sleutel] ? `<span class="count">${tellers[sleutel]}</span>` : ''}</button>`).join('');
  }

  let toastTimer;
  function meld(tekst) {
    const t = document.getElementById('toast');
    t.textContent = tekst;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
  }

  /* ------------------------------------------------------------ venster */

  let venster = null;

  function toonVenster(titel, inhoud, knoppen, breed) {
    venster = { knoppen };
    document.getElementById('overlay').innerHTML = `<div class="veil" data-act="sluitveil">
      <div class="panel ${breed ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(titel)}">
        <div class="ph"><h2>${esc(titel)}</h2><button class="x" data-act="sluit" aria-label="Sluiten">×</button></div>
        <div class="pb">${inhoud}</div>
        <div class="pf">${knoppen.map((k, i) =>
          `<button class="btn ${k.stijl || ''}" data-act="venster:${i}">${esc(k.tekst)}</button>`).join('')}</div>
      </div></div>`;
    const eerste = document.querySelector('#overlay input, #overlay textarea, #overlay .btn');
    if (eerste) eerste.focus();
  }

  function sluit() {
    venster = null;
    document.getElementById('overlay').innerHTML = '';
  }

  const veld = (id, label, waarde, plaats) =>
    `<label class="f"><span class="eyebrow">${label}</span>
      <input id="${id}" type="text" value="${esc(waarde == null ? '' : waarde)}"
        ${plaats ? `placeholder="${esc(plaats)}"` : ''}></label>`;
  const waarde = (id) => (document.getElementById(id) || {}).value || '';

  function vensterOnderdeel(p) {
    const gekozenFoto = { url: p ? p.photo || '' : '' };
    toonVenster(p ? 'Onderdeel wijzigen' : 'Nieuw onderdeel', `
      <div class="grid2">
        ${veld('f_name', 'Naam', p && p.name, 'Potscharnier 110° opdek')}
        ${veld('f_number', 'Artikelnummer', p && p.number, '71B3590 MB')}
        ${veld('f_location', 'Locatie', p && p.location, '3')}
        ${veld('f_supplier', 'Leverancier', p && p.supplier, 'Ostermann')}
        ${veld('f_category', 'Categorie', p && p.category, 'Scharnieren')}
        ${veld('f_unit', 'Eenheid', (p && p.unit) || 'stuks')}
        <label class="f wide"><span class="eyebrow">Opmerking</span>
          <textarea id="f_notes">${esc((p && p.notes) || '')}</textarea></label>
        <div class="wide">
          <span class="eyebrow">Foto</span>
          <div style="display:flex;gap:12px;align-items:center;margin-top:6px">
            <img id="f_preview" class="thumb" style="width:70px;height:54px" src="${esc(gekozenFoto.url || LEEG)}" alt="">
            <input id="f_file" type="file" accept="image/*" style="font-size:12.5px">
          </div>
        </div>
      </div>`, [
      { tekst: 'Annuleren' },
      { tekst: p ? 'Opslaan' : 'Toevoegen', stijl: 'solid', doe: async () => {
        const body = {
          name: waarde('f_name').trim(), number: waarde('f_number').trim(),
          location: waarde('f_location').trim(), supplier: waarde('f_supplier').trim(),
          category: waarde('f_category').trim(), unit: waarde('f_unit').trim() || 'stuks',
          notes: waarde('f_notes').trim(), photo: gekozenFoto.url,
        };
        if (!body.name) { meld('Vul een naam in.'); return false; }
        await schrijf(async () => {
          if (p) await partRef(p.id).set({ ...p, ...body });
          else await S.db.collection('parts').add(body);
        }, p ? 'Onderdeel bijgewerkt' : 'Onderdeel toegevoegd');
        return true;
      } },
    ], true);

    const file = document.getElementById('f_file');
    if (file) file.addEventListener('change', async () => {
      const b = file.files && file.files[0];
      if (!b) return;
      try {
        const url = S.assets ? (await S.assets.upload(b)).url : await verkleindeFoto(b);
        gekozenFoto.url = url;
        document.getElementById('f_preview').src = url;
        meld('Foto toegevoegd');
      } catch (e) { meld('De foto kon niet opgeslagen worden.'); }
    });
  }

  /** Maakt een gekozen foto klein genoeg om op dit apparaat te bewaren. */
  function verkleindeFoto(bestand) {
    return new Promise((klaar, fout) => {
      const lezer = new FileReader();
      lezer.onerror = () => fout(new Error('lezen mislukt'));
      lezer.onload = () => {
        const beeld = new Image();
        beeld.onerror = () => fout(new Error('geen afbeelding'));
        beeld.onload = () => {
          const schaal = Math.min(1, 800 / (beeld.width || 800));
          const doek = document.createElement('canvas');
          doek.width = Math.round(beeld.width * schaal);
          doek.height = Math.round(beeld.height * schaal);
          doek.getContext('2d').drawImage(beeld, 0, 0, doek.width, doek.height);
          klaar(doek.toDataURL('image/jpeg', 0.72));
        };
        beeld.src = lezer.result;
      };
      lezer.readAsDataURL(bestand);
    });
  }

  /* ------------------------------------------------------------ voorraad bijwerken */

  const regelsPerOnderdeel = (lines) => {
    const map = new Map();
    for (const r of lines || []) map.set(r.partId, (map.get(r.partId) || 0) + r.qty);
    return map;
  };

  /**
   * Boekt het verschil tussen twee versies van een kastlijst af of terug.
   * Een nieuwe kastlijst gaat er meteen van de voorraad af; wordt een lijst
   * kleiner of verwijderd, dan komt het weer terug. Onderdelen die nog niet
   * geteld zijn hebben geen aantal, daar valt niets aan bij te werken.
   */
  async function boekVoorraad(oudeLines, nieuweLines) {
    const oud = regelsPerOnderdeel(oudeLines);
    const nieuw = regelsPerOnderdeel(nieuweLines);
    for (const partId of new Set([...oud.keys(), ...nieuw.keys()])) {
      const verschil = (oud.get(partId) || 0) - (nieuw.get(partId) || 0);
      if (!verschil) continue;
      const p = partById(partId);
      if (!p || !isGeteld(p)) continue;
      await partRef(partId).update({ stock: p.stock + verschil });
    }
  }

  /* ------------------------------------------------------------ afronden */

  async function rondAf(l, mist) {
    const lines = (l.lines || []).map((r) => {
      const aantal = mist[r.partId] || 0;
      return { ...r, missingQty: Math.min(aantal, r.qty), missingHandled: false };
    });
    const tekort = lines.filter((r) => r.missingQty > 0);
    await schrijf(async () => {
      // Wat Dean niet kon pakken lag er niet: dat onderdeel staat op nul.
      for (const r of tekort) {
        const p = partById(r.partId);
        if (p && isGeteld(p) && p.stock !== 0) await partRef(r.partId).update({ stock: 0 });
      }
      await listRef(l.id).update({
        lines,
        status: tekort.length ? 'tekort' : 'gepakt',
        completedBy: S.wie,
        completedAt: nu(),
      });
    });
    S.lijstId = null;
    S.mist = null;
    teken(true);
    if (tekort.length) {
      const tekst = tekort.map((r) => `${r.missingQty} × ${(partById(r.partId) || {}).name}`).join(', ');
      toonVenster('Doorgegeven aan Roy', `
        <p><b>Dit staat nu op de lijst van Roy:</b></p>
        <p>${esc(tekst)}</p>
        <p class="faint" style="font-size:13px">Kast ${esc(l.cabinetNumber)} is afgerond.</p>`,
        [{ tekst: 'Klaar', stijl: 'solid' }]);
    } else {
      meld(`Kast ${l.cabinetNumber} compleet`);
    }
  }

  /* ------------------------------------------------------------ acties */

  async function doeActie(act) {
    const [naam, a] = act.split(':');

    if (naam === 'tab') { S.tab = a; S.lijstId = null; return teken(true); }
    if (naam === 'terug') { S.lijstId = null; S.mist = null; return teken(true); }
    if (naam === 'sluit' || naam === 'sluitveil') return sluit();
    if (naam === 'venster') {
      const knop = venster.knoppen[Number(a)];
      if (!knop.doe) return sluit();
      const klaar = await knop.doe();
      if (klaar !== false) sluit();
      return;
    }

    /* --- Roy: kastlijst maken --- */
    if (naam === 'voeg') {
      const regel = S.concept.lines.find((r) => r.partId === a);
      if (regel) regel.qty += 1; else S.concept.lines.push({ partId: a, qty: 1 });
      return teken(true);
    }
    if (naam === 'plus') { S.concept.lines.find((r) => r.partId === a).qty += 1; return teken(true); }
    if (naam === 'min') {
      const regel = S.concept.lines.find((r) => r.partId === a);
      regel.qty -= 1;
      if (regel.qty <= 0) S.concept.lines = S.concept.lines.filter((r) => r.partId !== a);
      return teken(true);
    }
    if (naam === 'weg') { S.concept.lines = S.concept.lines.filter((r) => r.partId !== a); return teken(true); }
    if (naam === 'conceptweg') { S.concept = null; return teken(true); }
    if (naam === 'bewaar') {
      const c = S.concept;
      c.cabinetNumber = waarde('kastnr').trim() || c.cabinetNumber;
      c.title = waarde('kasttitel').trim() || c.title;
      if (!c.cabinetNumber) { meld('Vul het kastnummer in.'); return; }
      if (!c.lines.length) { meld('Zet minimaal één onderdeel op de lijst.'); return; }
      return schrijf(async () => {
        if (c.id) {
          const oud = lijstById(c.id);
          const nieuweRegels = c.lines.map((r) => {
            const bestaand = ((oud && oud.lines) || []).find((x) => x.partId === r.partId) || {};
            return { partId: r.partId, qty: r.qty, missingQty: bestaand.missingQty || 0, missingHandled: Boolean(bestaand.missingHandled) };
          });
          await boekVoorraad((oud && oud.lines) || [], nieuweRegels);
          await listRef(c.id).update({
            cabinetNumber: c.cabinetNumber,
            title: c.title,
            lines: nieuweRegels,
          });
        } else {
          await boekVoorraad([], c.lines);
          await S.db.collection('lists').add({
            cabinetNumber: c.cabinetNumber,
            title: c.title,
            note: '',
            status: 'open',
            createdBy: S.wie,
            createdAt: nu(),
            completedBy: null,
            completedAt: null,
            lines: c.lines.map((r) => ({ partId: r.partId, qty: r.qty, missingQty: 0, missingHandled: false })),
          });
        }
        S.concept = null;
        teken(true);
      }, 'Kastlijst opgeslagen');
    }
    if (naam === 'nieuwonderdeel') return vensterOnderdeel(null);
    if (naam === 'wijzigonderdeel') return vensterOnderdeel(partById(a));

    if (naam === 'open' || naam === 'bekijk') { S.lijstId = a; return teken(true); }
    if (naam === 'wijziglijst') {
      const l = lijstById(a);
      S.concept = {
        id: l.id, cabinetNumber: l.cabinetNumber, title: l.title || '',
        lines: (l.lines || []).map((r) => ({ partId: r.partId, qty: r.qty })), zoek: '',
      };
      S.lijstId = null;
      return teken(true);
    }
    if (naam === 'verwijderlijst') {
      return schrijf(async () => {
        const l = lijstById(a);
        if (l && l.status === 'open') await boekVoorraad(l.lines || [], []);
        await listRef(a).delete();
        S.lijstId = null;
        teken(true);
      }, 'Kastlijst verwijderd');
    }

    /* --- Roy: te bestellen --- */
    if (naam === 'afgehandeld') {
      return schrijf(async () => {
        for (const l of S.lists) {
          let raak = false;
          const lines = (l.lines || []).map((r) => {
            if (r.partId === a && r.missingQty > 0 && !r.missingHandled) { raak = true; return { ...r, missingHandled: true }; }
            return r;
          });
          if (raak) await listRef(l.id).update({ lines });
        }
      }, 'Van de lijst gehaald');
    }

    /* --- Dean: pakken --- */
    if (naam === 'pak') { S.lijstId = a; S.mist = null; return teken(true); }
    if (naam === 'ja') {
      const l = lijstById(S.lijstId);
      return rondAf(l, {});
    }
    if (naam === 'nee') { S.mist = {}; return teken(true); }
    if (naam === 'terugpakken') { S.mist = null; return teken(true); }
    if (naam === 'vink') {
      const l = lijstById(S.lijstId);
      const regel = (l.lines || []).find((r) => r.partId === a);
      if (S.mist[a] === undefined) S.mist[a] = regel ? regel.qty : 1;
      else delete S.mist[a];
      return teken(true);
    }
    if (naam === 'mistplus' || naam === 'mistmin') {
      const l = lijstById(S.lijstId);
      const regel = (l.lines || []).find((r) => r.partId === a);
      const max = regel ? regel.qty : 1;
      const huidig = S.mist[a] || 0;
      S.mist[a] = naam === 'mistplus' ? Math.min(max, huidig + 1) : Math.max(1, huidig - 1);
      return teken(true);
    }
    if (naam === 'doorgeven') {
      const l = lijstById(S.lijstId);
      return rondAf(l, S.mist);
    }
  }

  /* ------------------------------------------------------------ luisteren */

  document.addEventListener('click', (e) => {
    const knop = e.target.closest('[data-act]');
    if (!knop) return;
    if (knop.classList.contains('veil') && e.target !== knop) return;
    e.preventDefault();
    doeActie(knop.dataset.act);
  });

  document.addEventListener('change', (e) => {
    const veld = e.target.closest('[data-tel]');
    if (veld) bewaarAantal(veld.dataset.tel, veld.value);
  });

  document.addEventListener('focusin', (e) => {
    if (e.target.classList && e.target.classList.contains('telveld')) e.target.select();
  });

  document.addEventListener('input', (e) => {
    if (e.target.id === 'zoekvoorraad') {
      S.telZoek = e.target.value;
      const doel = document.getElementById('telrijen');
      if (doel) doel.innerHTML = telRijen(zoeken(S.telZoek, onderdelen()));
    } else if (e.target.id === 'zoek' && S.concept) {
      S.concept.zoek = e.target.value;
      const doel = document.getElementById('zoekresultaat');
      if (doel) doel.innerHTML = zoekRijen(zoeken(S.concept.zoek, onderdelen()).slice(0, 30));
    } else if (e.target.id === 'kastnr' && S.concept) {
      S.concept.cabinetNumber = e.target.value;
    } else if (e.target.id === 'kasttitel' && S.concept) {
      S.concept.title = e.target.value;
    }
  });

  document.addEventListener('focusout', () => {
    setTimeout(() => {
      if (S.hertekenen && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) teken(true);
    }, 60);
  });

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && venster) sluit(); });

  const kies = document.getElementById('who');
  kies.innerHTML = MENSEN.map((m) => `<option ${m === S.wie ? 'selected' : ''}>${m}</option>`).join('');
  kies.addEventListener('change', () => {
    S.wie = kies.value;
    try { localStorage.setItem('wie', S.wie); } catch (err) { /* privémodus */ }
    S.tab = TABBLADEN[S.wie][0][0];
    S.lijstId = null;
    S.mist = null;
    teken(true);
  });

  teken(true);
  start();
})();
</script>
</body>
</html>
