<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Voorraad, kastlijsten en bestellijst voor de meubelonderdelen van PUUUR.">
<link rel="icon" href="img/favicon.svg">
<style>
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body { margin: 0; font: 14px system-ui, sans-serif; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Onderdelenbeheer Puuur</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">
<style>
  :root {
    --paper: #ffffff;
    --wash: #faf8f3;
    --ink: #15140f;
    --ink-2: #6b665b;
    --ink-3: #8f8a7e;
    --line: #e4e0d6;
    --line-2: #cfc9bb;
    --gold: #9a7722;
    --gold-line: #d7c289;
    --gold-wash: #f8f1dd;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  :root:not([data-theme="light"]) { color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #131210;
      --wash: #1a1816;
      --ink: #f3efe5;
      --ink-2: #a09a8c;
      --ink-3: #837d70;
      --line: #2c2a25;
      --line-2: #3d3a33;
      --gold: #d9b661;
      --gold-line: #5c4d26;
      --gold-wash: #221e16;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #131210;
    --wash: #1a1816;
    --ink: #f3efe5;
    --ink-2: #a09a8c;
    --ink-3: #837d70;
    --line: #2c2a25;
    --line-2: #3d3a33;
    --gold: #d9b661;
    --gold-line: #5c4d26;
    --gold-wash: #221e16;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14.5px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0; }
  button { font: inherit; color: inherit; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  .muted { color: var(--ink-2); }
  .faint { color: var(--ink-3); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ---------------------------------------------------------- raamwerk */
  .page { max-width: 1060px; margin: 0 auto; padding-inline: 20px; }
  header.top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .bar {
    max-width: 1060px;
    margin: 0 auto;
    padding: 16px 20px 10px;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .mark { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
  .mark span { color: var(--gold); letter-spacing: 0.16em; font-weight: 600; }
  .bar .who { margin-left: auto; display: flex; align-items: baseline; gap: 8px; }
  .eyebrow {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.13em;
    color: var(--ink-3);
    font-weight: 600;
  }
  select#who {
    font: inherit;
    font-size: 13.5px;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 3px 8px;
    border-radius: 0;
  }
  nav.tabs {
    max-width: 1060px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    gap: 22px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    padding: 6px 0 10px;
    cursor: pointer;
    color: var(--ink-2);
    font-size: 14px;
    white-space: nowrap;
  }
  nav.tabs button:hover { color: var(--ink); }
  nav.tabs button[aria-current="true"] { color: var(--ink); border-bottom-color: var(--gold); font-weight: 500; }
  nav.tabs .count { font-family: var(--mono); font-size: 11.5px; color: var(--gold); margin-left: 4px; }
  main { padding-block: 26px 80px; }

  /* ---------------------------------------------------------- bouwstenen */
  section { margin-top: 38px; }
  .head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .head h2 { font-size: 16px; }
  .head .right { margin-left: auto; display: flex; gap: 14px; align-items: baseline; }

  .btn {
    background: none;
    border: 1px solid var(--line-2);
    padding: 7px 14px;
    cursor: pointer;
    font-size: 13.5px;
    border-radius: 0;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink); }
  .btn.solid { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .btn.solid:hover { opacity: 0.86; }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: #17160f; font-weight: 500; }
  .btn.gold:hover { opacity: 0.88; }
  .btn.lg { padding: 11px 20px; font-size: 14.5px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .link {
    background: none; border: 0; padding: 0; cursor: pointer;
    font-size: 13.5px; color: var(--ink-2); border-bottom: 1px solid var(--line-2);
  }
  .link:hover { color: var(--ink); border-bottom-color: var(--gold); }
  .link[aria-current="true"] { color: var(--ink); border-bottom-color: var(--gold); }

  .chip {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border: 1px solid var(--line-2);
    color: var(--ink-2);
    white-space: nowrap;
  }
  .chip.order { border-color: var(--gold-line); background: var(--gold-wash); color: var(--gold); font-weight: 600; }
  .chip.out { border-color: var(--ink); background: var(--ink); color: var(--paper); font-weight: 600; }
  .chip.gold-line { border-color: var(--gold-line); color: var(--gold); }

  input[type="text"], input[type="search"], input[type="number"], textarea, select.f {
    font: inherit;
    font-size: 14px;
    width: 100%;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line-2);
    border-radius: 0;
    padding: 8px 10px;
  }
  input:focus, textarea:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }
  textarea { min-height: 64px; resize: vertical; }
  label.f { display: block; }
  label.f > span { display: block; margin-bottom: 4px; }
  .grid2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
  .grid2 .wide { grid-column: 1 / -1; }

  .search { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line-2); padding-bottom: 6px; }
  .search input { border: 0; padding: 4px 0; background: none; }
  .search input:focus { outline: none; }
  .search .ico { color: var(--ink-3); font-size: 13px; }

  .tools { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; margin-bottom: 18px; }
  .tools .spacer { margin-left: auto; }
  .filters { display: flex; gap: 14px; flex-wrap: wrap; }

  /* ---------------------------------------------------------- tabellen */
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-3);
    font-weight: 600;
    padding: 0 10px 7px 0;
    border-bottom: 1px solid var(--line-2);
    white-space: nowrap;
  }
  th.num { text-align: right; }
  td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
  td:last-child, th:last-child { padding-right: 0; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--wash); }
  .thumb {
    width: 46px; height: 34px; object-fit: cover;
    background: var(--wash); border: 1px solid var(--line); display: block;
  }
  .thumb.big { width: 148px; height: 110px; }
  .name { font-weight: 500; }
  .code { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
  .cell { display: flex; align-items: center; gap: 11px; min-width: 210px; }

  /* ---------------------------------------------------------- cijfers */
  .figures { display: flex; flex-wrap: wrap; gap: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .figure { flex: 1 1 150px; padding: 14px 18px 14px 0; }
  .figure + .figure { border-left: 1px solid var(--line); padding-left: 18px; }
  .figure .v { font-family: var(--mono); font-size: 26px; font-weight: 500; line-height: 1.2; }
  .figure .v.mark { color: var(--gold); }
  .figure .l { font-size: 12.5px; color: var(--ink-2); }

  .note { border-left: 2px solid var(--gold); padding: 8px 0 8px 14px; margin-bottom: 22px; font-size: 14px; }
  .note b { font-weight: 600; }

  /* ---------------------------------------------------------- rijen */
  .rows { border-top: 1px solid var(--line); }
  .row {
    display: flex; align-items: center; gap: 14px;
    padding: 13px 0; border-bottom: 1px solid var(--line);
  }
  .row .grow { flex: 1; min-width: 0; }
  .row.click { cursor: pointer; }
  .row.click:hover { background: var(--wash); }
  .kast { font-family: var(--mono); font-size: 17px; font-weight: 600; letter-spacing: 0.02em; }
  .kast small { display: block; font-size: 9.5px; letter-spacing: 0.14em; color: var(--ink-3); font-weight: 500; }

  /* ---------------------------------------------------------- pakken */
  .pick { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .pick.done { background: var(--wash); }
  .pick .grow { flex: 1; min-width: 140px; }
  .pick .nm { font-size: 15.5px; font-weight: 500; }
  .need { font-family: var(--mono); font-size: 20px; min-width: 42px; text-align: right; }
  .need small { display: block; font-size: 9.5px; letter-spacing: 0.1em; color: var(--ink-3); text-transform: uppercase; }
  .step { display: inline-flex; border: 1px solid var(--line-2); }
  .step button { width: 30px; height: 32px; background: none; border: 0; cursor: pointer; color: var(--ink-2); font-size: 15px; }
  .step button:hover { color: var(--ink); background: var(--wash); }
  .step span { width: 38px; height: 32px; display: grid; place-items: center; font-family: var(--mono); border-inline: 1px solid var(--line); }
  .tick {
    width: 34px; height: 34px; border: 1px solid var(--line-2); background: none;
    cursor: pointer; display: grid; place-items: center; color: var(--line-2); flex: none;
  }
  .tick:hover { border-color: var(--gold); }
  .tick.on { background: var(--gold); border-color: var(--gold); color: #17160f; }
  .tick svg { width: 18px; height: 18px; }
  .foot-actions {
    position: sticky; bottom: 0; background: var(--paper);
    border-top: 1px solid var(--line-2);
    padding: 14px 0 calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  }
  .foot-actions .spacer { margin-left: auto; }

  /* ---------------------------------------------------------- venster */
  .veil {
    position: fixed; inset: 0; background: rgba(10, 9, 7, 0.55);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 5vh 16px; overflow-y: auto; z-index: 50;
  }
  .panel { background: var(--paper); border: 1px solid var(--line-2); width: 100%; max-width: 540px; }
  .panel.wide { max-width: 720px; }
  .panel h2 { font-size: 16px; }
  .panel .ph { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .panel .pb { padding: 18px 20px; display: grid; gap: 14px; }
  .panel .pf { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--wash); }
  .x { margin-left: auto; background: none; border: 0; cursor: pointer; color: var(--ink-2); font-size: 18px; line-height: 1; padding: 4px; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    background: var(--ink); color: var(--paper);
    padding: 10px 18px; font-size: 13.5px; z-index: 60;
  }

  .empty { padding: 30px 0; color: var(--ink-3); font-size: 14px; }
  .list-note { font-size: 13px; color: var(--ink-2); }
  .detail { display: grid; gap: 20px; grid-template-columns: 148px 1fr; padding: 16px 0 20px; border-bottom: 1px solid var(--line); }
  .spec { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 13.5px; }
  .spec dt { color: var(--ink-2); }
  .spec dd { margin: 0; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }

  @media (max-width: 620px) {
    .figure + .figure { border-left: 0; padding-left: 0; }
    .detail { grid-template-columns: 1fr; }
    .pick { flex-wrap: wrap; }
    .pick .grow { flex-basis: 55%; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="mark">Onderdelenbeheer <span>PUUUR</span></div>
    <div class="who">
      <label class="eyebrow" for="who">Ingelogd als</label>
      <select id="who"></select>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Schermen"></nav>
</header>
<div class="page"><main id="view"></main></div>
<div id="overlay"></div>
<div id="toast" hidden class="toast"></div>

<script>
(() => {
  const TABS = [
    ['overzicht', 'Overzicht'],
    ['onderdelen', 'Onderdelen'],
    ['kastlijsten', 'Kastlijsten'],
    ['pakken', 'Pakken'],
    ['bestellen', 'Bestellen'],
  ];
  const MENSEN = ['Roy', 'Dean', 'Werkplaats'];
  const LEEG = 'img/placeholder.svg';

  const S = {
    db: null, assets: null, klaar: false, verbinding: 'laden',
    parts: [], lists: [], orders: [], log: [],
    tab: 'overzicht', wie: 'Roy',
    zoek: '', filter: 'alles',
    open: null,          // uitgeklapt onderdeel
    lijst: null,         // kastlijst die bekeken of gepakt wordt
    concept: null,       // nieuwe kastlijst in de maak
    gepakt: null,        // { listId, map }
    wacht: false,
  };

  try { S.wie = localStorage.getItem('wie') || 'Roy'; } catch (e) { /* privémodus */ }

  /* ------------------------------------------------------------ gegevens */

  const docs = (snap) => snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  const nu = () => new Date().toISOString();

  /**
   * Opslag op dit apparaat. Wordt gebruikt als de site als gewone website
   * draait; binnen Claude praat de pagina met de gedeelde opslag.
   * Dezelfde functies, zodat de rest van het programma niets hoeft te weten.
   */
  function lokaleOpslag() {
    const SLEUTEL = 'onderdelenbeheer-puuur';
    const leeg = () => ({ parts: {}, lists: {}, orders: {}, meta: {} });
    let data = leeg();
    try { data = Object.assign(leeg(), JSON.parse(localStorage.getItem(SLEUTEL) || '{}')); } catch (e) { /* privémodus */ }
    const luisteraars = [];

    const bewaar = () => {
      try { localStorage.setItem(SLEUTEL, JSON.stringify(data)); } catch (e) { meld('Het geheugen van deze browser zit vol.'); }
      luisteraars.forEach((fn) => fn());
    };
    const snapDoc = (col, id) => ({ id, exists: Boolean(data[col][id]), data: () => data[col][id], metadata: {} });
    const nieuwId = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    const docRef = (col, id) => ({
      id,
      path: col + '/' + id,
      get: async () => snapDoc(col, id),
      set: async (d) => { data[col][id] = JSON.parse(JSON.stringify(d)); bewaar(); },
      update: async (d) => { data[col][id] = { ...(data[col][id] || {}), ...JSON.parse(JSON.stringify(d)) }; bewaar(); },
      delete: async () => { delete data[col][id]; bewaar(); },
      onSnapshot(next) {
        const fn = () => next(snapDoc(col, id));
        luisteraars.push(fn);
        setTimeout(fn, 0);
        return () => {};
      },
    });

    return {
      lokaal: true,
      collection: (col) => ({
        onSnapshot(next) {
          const fn = () => next({ docs: Object.keys(data[col] || {}).map((id) => snapDoc(col, id)) });
          luisteraars.push(fn);
          setTimeout(fn, 0);
          return () => {};
        },
        doc: (id) => docRef(col, id || nieuwId()),
        add: async (d) => { const id = nieuwId(); data[col][id] = JSON.parse(JSON.stringify(d)); bewaar(); return docRef(col, id); },
      }),
      doc: (pad) => { const [col, id] = pad.split('/'); return docRef(col, id); },
      alles: () => data,
      vervangAlles: (nieuw) => { data = Object.assign(leeg(), nieuw); bewaar(); },
      isLeeg: () => !Object.keys(data.parts).length,
    };
  }

  /** De eerste keer vullen met de onderdelenlijst die naast de pagina staat. */
  async function vulEersteKeer(opslag) {
    if (!opslag.isLeeg()) return;
    try {
      const antwoord = await fetch('gegevens.json', { cache: 'no-store' });
      if (!antwoord.ok) return;
      opslag.vervangAlles(await antwoord.json());
    } catch (e) { /* zonder startlijst begint het programma leeg */ }
  }

  async function start() {
    let db = null, assets = null;
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
    try { assets = window.claude && window.claude.use ? await window.claude.use('assets') : null; } catch (e) { assets = null; }
    S.assets = assets;
    if (!db) {
      db = lokaleOpslag();
      S.lokaal = true;
      await vulEersteKeer(db);
    }
    S.db = db;
    const fout = () => { S.verbinding = 'geen'; teken(true); };
    db.collection('parts').onSnapshot((s) => { S.parts = docs(s); S.klaar = true; S.verbinding = 'ok'; teken(); }, fout);
    db.collection('lists').onSnapshot((s) => { S.lists = docs(s); teken(); }, fout);
    db.collection('orders').onSnapshot((s) => { S.orders = docs(s); teken(); }, fout);
    db.doc('meta/log').onSnapshot((s) => { S.log = (s.exists && s.data().items) || []; teken(); }, fout);
  }

  /** Voorraad, reservering en besteladvies per onderdeel. */
  function onderdelen() {
    const bezet = {}, tekort = {}, besteld = {};
    for (const l of S.lists) {
      if (l.status === 'open' || l.status === 'bezig') {
        for (const r of l.lines || []) bezet[r.partId] = (bezet[r.partId] || 0) + Math.max(0, r.qty - (r.pickedQty || 0));
      }
      for (const r of l.lines || []) {
        if (r.missingQty > 0 && !r.missingHandled) tekort[r.partId] = (tekort[r.partId] || 0) + r.missingQty;
      }
    }
    for (const o of S.orders) if (o.status === 'open') besteld[o.partId] = (besteld[o.partId] || 0) + o.qty;

    return S.parts.map((p) => {
      const stock = p.stock || 0;
      const res = bezet[p.id] || 0;
      const vrij = stock - res;
      const kort = tekort[p.id] || 0;
      const ond = besteld[p.id] || 0;
      const min = p.minStock || 0;
      const status = p.geteld !== true ? 'onbekend'
        : vrij <= 0 ? 'op' : vrij <= min ? (ond > 0 ? 'besteld' : 'bestellen') : 'ok';
      const advies = Math.max(p.orderQty || 1, Math.ceil(min * 2 - vrij - ond + kort), 1);
      return { ...p, stock, reserved: res, vrij, tekort: kort, besteld: ond, minStock: min, status, advies };
    }).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'nl'));
  }

  const teBestellen = (ps) => ps.filter((p) => (p.status !== 'ok' && p.status !== 'onbekend') || p.tekort > 0)
    .sort((a, b) => rang(a) - rang(b) || a.vrij - b.vrij);
  const rang = (p) => (p.tekort > 0 ? 0 : p.status === 'op' ? 1 : p.status === 'bestellen' ? 2 : 3);
  const openLijsten = () => S.lists.filter((l) => l.status === 'open' || l.status === 'bezig')
    .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));

  function zoeken(term, lijst) {
    const q = (term || '').trim().toLowerCase();
    if (!q) return lijst;
    const woorden = q.split(/\s+/);
    return lijst.filter((p) => {
      const hooi = `${p.number} ${p.name} ${p.category} ${p.supplier} ${p.location}`.toLowerCase();
      return woorden.every((w) => hooi.includes(w));
    });
  }

  /* ------------------------------------------------------------ schrijven */

  async function schrijf(actie, melding) {
    if (!S.db) return;
    S.wacht = true;
    try {
      await actie();
      if (melding) meld(melding);
    } catch (e) {
      meld(e && e.code === 'invalid_argument' ? 'Je mag deze gegevens niet wijzigen.' : 'Opslaan is niet gelukt. Probeer het opnieuw.');
    }
    S.wacht = false;
  }

  async function logboek(tekst) {
    if (!S.db) return;
    const items = [{ tekst, door: S.wie, at: nu() }].concat(S.log).slice(0, 60);
    await S.db.doc('meta/log').set({ items });
  }

  const partRef = (id) => S.db.doc('parts/' + id);
  const listRef = (id) => S.db.doc('lists/' + id);

  /* ------------------------------------------------------------ opmaak */

  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const datum = (iso) => {
    if (!iso) return '–';
    const d = new Date(iso), n = new Date();
    const zelfde = d.toDateString() === n.toDateString();
    if (zelfde) return 'vandaag ' + d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
    const gisteren = new Date(n.getTime() - 864e5).toDateString() === d.toDateString();
    if (gisteren) return 'gisteren';
    return d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
  };

  const CHIP = {
    op: '<span class="chip out">Op</span>',
    bestellen: '<span class="chip order">Bestellen</span>',
    besteld: '<span class="chip">Besteld</span>',
    ok: '<span class="faint">–</span>',
    onbekend: '<span class="chip">nog niet geteld</span>',
  };
  const chip = (p) => (p.tekort > 0 ? `<span class="chip order">${p.tekort} tekort</span>` : CHIP[p.status]);
  const foto = (p, klas) => `<img class="thumb ${klas || ''}" src="${esc(p.photo || LEEG)}" alt="" loading="lazy">`;
  const kort = (p) => p.number || (p.location ? 'locatie ' + p.location : '');
  const herkomst = (p) => [p.number, p.location ? 'locatie ' + p.location : ''].filter(Boolean).join(' · ') || 'geen nummer of locatie';
  const cel = (p) => `<div class="cell">${foto(p)}<div><div class="name">${esc(p.name)}</div>
    <div class="code">${esc(kort(p))}</div></div></div>`;
  const stuk = (p, n) => `${n} <span class="faint">${esc(p.unit || 'stuks')}</span>`;

  /* ------------------------------------------------------------ schermen */

  function schermOverzicht(ps) {
    const advies = teBestellen(ps);
    const tekorten = ps.filter((p) => p.tekort > 0);
    const open = openLijsten();
    const onderweg = S.orders.filter((o) => o.status === 'open');

    return `
      ${tekorten.length ? `<div class="note"><b>Uit de werkplaats:</b> ${tekorten
        .map((p) => `${p.tekort} × ${esc(p.name)}`).join(', ')} — nog te bestellen.</div>` : ''}
      <div class="figures">
        <div class="figure"><div class="v ${advies.length ? 'mark' : ''}">${advies.filter((p) => p.status !== 'besteld').length}</div>
          <div class="l">moet besteld worden</div></div>
        <div class="figure"><div class="v">${ps.filter((p) => p.status === 'op').length}</div><div class="l">helemaal op</div></div>
        <div class="figure"><div class="v">${open.length}</div><div class="l">open kastlijsten</div></div>
        <div class="figure"><div class="v">${onderweg.reduce((s, o) => s + o.qty, 0)}</div><div class="l">stuks onderweg</div></div>
      </div>
      ${ps.filter((p) => p.status === 'onbekend').length ? `<p class="faint" style="margin-top:10px;font-size:13px">
        ${ps.filter((p) => p.status === 'onbekend').length} onderdelen zijn nog niet geteld — vul de voorraad in bij Onderdelen,
        dan houdt het programma zelf bij wanneer er besteld moet worden.</p>` : ''}

      <section>
        <div class="head"><h2>Bestellen voor het op is</h2>
          <div class="right"><button class="link" data-act="tab:bestellen">Alles bekijken</button></div></div>
        ${advies.length ? `<div class="scroll"><table><thead><tr>
          <th>Onderdeel</th><th class="num">Vrij</th><th class="num">Bestelpunt</th><th>Status</th><th></th></tr></thead>
          <tbody>${advies.slice(0, 6).map((p) => `<tr>
            <td>${cel(p)}</td>
            <td class="num">${p.vrij}</td>
            <td class="num faint">${p.minStock}</td>
            <td>${chip(p)}</td>
            <td style="text-align:right"><button class="btn" data-act="bestel:${p.id}">Bestellen</button></td>
          </tr>`).join('')}</tbody></table></div>`
        : `<p class="empty">${ps.every((p) => p.status === 'onbekend')
          ? 'Zodra de voorraad is ingevuld, staat hier wat besteld moet worden.'
          : 'Alles zit boven het bestelpunt.'}</p>`}
      </section>

      <section>
        <div class="head"><h2>Openstaande kastlijsten</h2>
          <div class="right"><button class="link" data-act="nieuwelijst">Nieuwe kastlijst</button></div></div>
        ${open.length ? `<div class="rows">${open.map((l) => rijLijst(l)).join('')}</div>`
        : '<p class="empty">Er staat niets klaar om te pakken.</p>'}
      </section>

      <section>
        <div class="head"><h2>Laatste gebeurtenissen</h2>
          ${S.lokaal ? `<div class="right"><button class="link" data-act="exporteer">Gegevens opslaan als bestand</button>
            <button class="link" data-act="importeer">Bestand inlezen</button></div>` : ''}</div>
        ${S.log.length ? `<div class="rows">${S.log.slice(0, 6).map((e) => `<div class="row">
          <div class="grow">${esc(e.tekst)}</div>
          <div class="faint mono" style="font-size:12px">${esc(e.door || '')} · ${datum(e.at)}</div>
        </div>`).join('')}</div>` : '<p class="empty">Nog niets gebeurd.</p>'}
      </section>`;
  }

  function rijLijst(l, klik) {
    const totaal = (l.lines || []).reduce((s, r) => s + r.qty, 0);
    const gepakt = (l.lines || []).reduce((s, r) => s + Math.min(r.pickedQty || 0, r.qty), 0);
    const staat = l.status === 'bezig' ? `<span class="chip gold-line">Bezig · ${gepakt}/${totaal}</span>`
      : l.status === 'open' ? '<span class="chip">Klaar om te pakken</span>'
      : l.status === 'tekort' ? '<span class="chip order">Tekort gemeld</span>'
      : '<span class="chip">Compleet gepakt</span>';
    return `<div class="row click" data-act="${klik || 'lijst'}:${l.id}">
      <div class="kast"><small>KAST</small>${esc(l.cabinetNumber)}</div>
      <div class="grow"><div class="name">${esc(l.title || 'Kastlijst')}</div>
        <div class="list-note faint">${(l.lines || []).length} onderdelen · ${totaal} stuks · ${datum(l.createdAt)}</div></div>
      ${staat}
    </div>`;
  }

  function schermOnderdelen(ps) {
    const past = (p) => S.filter === 'alles' ? true
      : S.filter === 'bestellen' ? (p.status === 'bestellen' || p.status === 'op')
      : S.filter === 'onbekend' ? p.status === 'onbekend'
      : p.status === 'ok';
    const lijst = zoeken(S.zoek, ps.filter(past));
    const f = (k, t) => `<button class="link" data-act="filter:${k}" aria-current="${S.filter === k}">${t}</button>`;

    return `
      <div class="tools">
        <div class="search" style="flex:1 1 260px;max-width:380px">
          <span class="ico">zoek</span>
          <input id="zoek" type="search" value="${esc(S.zoek)}" placeholder="naam, nummer, leverancier of locatie">
        </div>
        <div class="filters">${f('alles', 'Alles')}${f('bestellen', 'Bestellen')}${f('ok', 'Op voorraad')}${f('onbekend', 'Nog te tellen')}</div>
        <div class="spacer"></div>
        <button class="btn" data-act="nieuwonderdeel">Onderdeel toevoegen</button>
      </div>
      <div id="onderdelenlijst">${tabelOnderdelen(lijst)}</div>`;
  }

  function tabelOnderdelen(lijst) {
    if (!lijst.length) return '<p class="empty">Geen onderdelen gevonden.</p>';
    return `<div class="scroll"><table><thead><tr>
      <th>Onderdeel</th><th>Locatie</th><th class="num">Voorraad</th><th class="num">Bezet</th>
      <th class="num">Vrij</th><th class="num">Bestelpunt</th><th>Status</th></tr></thead>
      <tbody>${lijst.map((p) => `<tr class="click" data-act="toon:${p.id}">
        <td>${cel(p)}</td>
        <td class="faint" style="font-size:13px">${esc(p.location || '–')}</td>
        <td class="num">${p.geteld ? p.stock : '–'}</td>
        <td class="num faint">${p.reserved || '–'}</td>
        <td class="num" style="font-weight:600">${p.geteld ? p.vrij : '–'}</td>
        <td class="num faint">${p.minStock}</td>
        <td>${chip(p)}</td>
      </tr>${S.open === p.id ? `<tr><td colspan="7" style="padding:0">${detail(p)}</td></tr>` : ''}`).join('')}
      </tbody></table></div>`;
  }

  function detail(p) {
    const staat = S.lists.filter((l) => (l.status === 'open' || l.status === 'bezig')
      && (l.lines || []).some((r) => r.partId === p.id));
    return `<div class="detail">
      ${foto(p, 'big')}
      <div>
        <dl class="spec">
          <dt>Artikelnummer</dt><dd class="mono">${esc(p.number || '–')}</dd>
          <dt>Categorie</dt><dd>${esc(p.category || '–')}</dd>
          <dt>Leverancier</dt><dd>${esc(p.supplier || '–')}</dd>
          <dt>Locatie</dt><dd>${esc(p.location || '–')}</dd>
          <dt>Voorraad</dt><dd>${p.geteld ? `${stuk(p, p.stock)} — waarvan ${p.reserved} bezet, ${p.vrij} vrij` : 'nog niet geteld'}</dd>
          <dt>Bestelpunt</dt><dd>${p.minStock} · standaard bestellen per ${p.orderQty || 1}</dd>
          ${p.notes ? `<dt>Opmerking</dt><dd>${esc(p.notes)}</dd>` : ''}
          ${staat.length ? `<dt>Staat op</dt><dd>${staat.map((l) => 'kast ' + esc(l.cabinetNumber)).join(', ')}</dd>` : ''}
        </dl>
        <div class="acts">
          <span class="eyebrow">Voorraad</span>
          <button class="btn" data-act="voorraad:${p.id}:-1">−1</button>
          <button class="btn" data-act="voorraad:${p.id}:1">+1</button>
          <button class="btn" data-act="voorraad:${p.id}:10">+10</button>
          <button class="btn" data-act="tellen:${p.id}">Tellen…</button>
          <span style="width:10px"></span>
          <button class="btn" data-act="wijzig:${p.id}">Wijzigen</button>
          <button class="btn solid" data-act="bestel:${p.id}">Bestellen</button>
        </div>
      </div>
    </div>`;
  }

  function schermKastlijsten() {
    if (S.concept) return schermConcept();
    if (S.lijst) return schermLijst(S.lijst);
    const alle = S.lists.slice().sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    return `
      <div class="tools">
        <div class="search" style="flex:1 1 240px;max-width:340px">
          <span class="ico">zoek</span>
          <input id="zoeklijst" type="search" value="${esc(S.zoek)}" placeholder="kastnummer of omschrijving">
        </div>
        <div class="spacer"></div>
        <button class="btn solid" data-act="nieuwelijst">Nieuwe kastlijst</button>
      </div>
      ${alle.length ? `<div class="rows" id="lijstrijen">${alle
        .filter((l) => `${l.cabinetNumber} ${l.title}`.toLowerCase().includes(S.zoek.trim().toLowerCase()))
        .map((l) => rijLijst(l)).join('')}</div>`
      : '<p class="empty">Nog geen kastlijsten. Maak er een voor de kast die gemaakt wordt.</p>'}`;
  }

  function schermLijst(id) {
    const l = S.lists.find((x) => x.id === id);
    if (!l) return '<p class="empty">Kastlijst niet gevonden.</p>';
    const ps = onderdelen();
    const mist = (l.lines || []).filter((r) => r.missingQty > 0);
    const open = l.status === 'open' || l.status === 'bezig';
    return `
      <button class="link" data-act="terug" style="margin-bottom:18px">← Alle kastlijsten</button>
      ${mist.length ? `<div class="note"><b>Tekort gemeld:</b> ${mist.map((r) => {
        const p = ps.find((x) => x.id === r.partId);
        return `${r.missingQty} × ${esc(p ? p.name : 'onbekend')}`;
      }).join(', ')}</div>` : ''}
      <div class="row" style="border-top:1px solid var(--line)">
        <div class="kast" style="font-size:22px"><small>KAST</small>${esc(l.cabinetNumber)}</div>
        <div class="grow"><div class="name" style="font-size:16px">${esc(l.title || 'Kastlijst')}</div>
          <div class="list-note faint">Aangemaakt door ${esc(l.createdBy || '')} · ${datum(l.createdAt)}${
            l.completedAt ? ` · gepakt door ${esc(l.completedBy || '')} ${datum(l.completedAt)}` : ''}</div></div>
        ${open ? `<button class="btn solid" data-act="pak:${l.id}">Onderdelen pakken</button>` : ''}
        ${open ? `<button class="btn" data-act="wijziglijst:${l.id}">Wijzigen</button>` : ''}
      </div>
      ${l.note ? `<p class="list-note" style="padding:12px 0">${esc(l.note)}</p>` : ''}
      <div class="scroll" style="margin-top:18px"><table><thead><tr>
        <th>Onderdeel</th><th>Locatie</th><th class="num">Nodig</th><th class="num">Gepakt</th><th class="num">Mist</th>
      </tr></thead><tbody>${(l.lines || []).map((r) => {
        const p = ps.find((x) => x.id === r.partId) || { name: 'Onbekend onderdeel', number: '', photo: '' };
        return `<tr><td>${cel(p)}</td><td class="faint" style="font-size:13px">${esc(p.location || '–')}</td>
          <td class="num">${r.qty}</td>
          <td class="num faint">${l.status === 'open' ? '–' : (r.pickedQty || 0)}</td>
          <td class="num">${r.missingQty ? `<span class="chip order">${r.missingQty}</span>` : '<span class="faint">–</span>'}</td></tr>`;
      }).join('')}</tbody></table></div>
      ${open ? `<div class="acts" style="margin-top:20px"><button class="link" data-act="verwijderlijst:${l.id}">Kastlijst verwijderen</button></div>` : ''}`;
  }

  function schermConcept() {
    const c = S.concept;
    const ps = onderdelen();
    const gevonden = zoeken(c.zoek, ps).slice(0, 25);
    const totaal = c.lines.reduce((s, r) => s + r.qty, 0);
    return `
      <button class="link" data-act="terug" style="margin-bottom:18px">← Alle kastlijsten</button>
      <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));max-width:620px">
        <label class="f"><span class="eyebrow">Kastnummer</span>
          <input id="kastnr" type="text" inputmode="numeric" value="${esc(c.cabinetNumber)}" placeholder="51436"></label>
        <label class="f"><span class="eyebrow">Omschrijving</span>
          <input id="kasttitel" type="text" value="${esc(c.title)}" placeholder="Keukenkast onderbouw 600 mm"></label>
      </div>

      <section>
        <div class="head"><h2>Onderdeel zoeken</h2></div>
        <div class="search" style="max-width:380px"><span class="ico">zoek</span>
          <input id="conceptzoek" type="search" value="${esc(c.zoek)}" placeholder="naam, nummer of locatie"></div>
        <div class="rows" style="margin-top:14px" id="conceptresultaat">${gevonden.map((p) => `<div class="row">
          ${foto(p)}<div class="grow"><div class="name">${esc(p.name)}</div>
            <div class="code">${esc(kort(p))} · ${p.geteld ? p.vrij + ' vrij' : 'nog niet geteld'}</div></div>
          <button class="btn" data-act="conceptadd:${p.id}">Toevoegen</button></div>`).join('')}</div>
      </section>

      <section>
        <div class="head"><h2>Onderdelen op de lijst</h2>
          <div class="right faint">${c.lines.length} regels · ${totaal} stuks</div></div>
        ${c.lines.length ? `<div class="rows">${c.lines.map((r) => {
          const p = ps.find((x) => x.id === r.partId) || {};
          const tekort = r.qty > (p.vrij || 0);
          return `<div class="row">${foto(p)}
            <div class="grow"><div class="name">${esc(p.name)}</div>
              <div class="code">${esc(kort(p))}${p.geteld ? ` · ${p.vrij || 0} vrij` : ''}${tekort && p.geteld ? ' — meer dan er vrij is' : ''}</div></div>
            <div class="step"><button data-act="conceptmin:${r.partId}">−</button><span>${r.qty}</span>
              <button data-act="conceptplus:${r.partId}">+</button></div>
            <button class="link" data-act="conceptweg:${r.partId}">weg</button></div>`;
        }).join('')}</div>` : '<p class="empty">Nog niets toegevoegd. Zoek hieronder een onderdeel.</p>'}
      </section>

      <div class="foot-actions">
        <span class="faint">${c.id ? 'Wijzigingen worden bij opslaan doorgevoerd.' : 'Roy maakt de lijst, Dean pakt hem.'}</span>
        <div class="spacer"></div>
        <button class="btn" data-act="terug">Annuleren</button>
        <button class="btn solid lg" data-act="bewaarlijst">Kastlijst opslaan</button>
      </div>`;
  }

  function schermPakken(ps) {
    if (S.gepakt) return schermPakscherm(ps);
    const open = openLijsten();
    return `
      <p class="muted" style="margin-bottom:18px">Kies de kast die je gaat maken.</p>
      ${open.length ? `<div class="rows">${open.map((l) => rijLijst(l, 'pak')).join('')}</div>`
      : '<p class="empty">Er staat geen kastlijst klaar.</p>'}
      ${S.lists.some((l) => l.status === 'gepakt' || l.status === 'tekort') ? `<section>
        <div class="head"><h2>Laatst afgerond</h2></div>
        <div class="rows">${S.lists.filter((l) => l.status === 'gepakt' || l.status === 'tekort')
          .sort((a, b) => (b.completedAt || '').localeCompare(a.completedAt || '')).slice(0, 4)
          .map((l) => rijLijst(l)).join('')}</div></section>` : ''}`;
  }

  function schermPakscherm(ps) {
    const l = S.lists.find((x) => x.id === S.gepakt.listId);
    if (!l) return '<p class="empty">Kastlijst niet gevonden.</p>';
    const map = S.gepakt.map;
    const nodig = (l.lines || []).reduce((s, r) => s + r.qty, 0);
    const gepakt = (l.lines || []).reduce((s, r) => s + Math.min(map[r.partId] || 0, r.qty), 0);
    const compleet = gepakt >= nodig;

    return `
      <button class="link" data-act="stoppakken" style="margin-bottom:18px">← Andere kast</button>
      <div class="row" style="border-top:1px solid var(--line)">
        <div class="kast" style="font-size:22px"><small>KAST</small>${esc(l.cabinetNumber)}</div>
        <div class="grow"><div class="name" style="font-size:16px">${esc(l.title || 'Kastlijst')}</div>
          ${l.note ? `<div class="list-note faint">${esc(l.note)}</div>` : ''}</div>
        <div class="mono faint">${gepakt} / ${nodig} stuks</div>
      </div>
      ${(l.lines || []).map((r) => {
        const p = ps.find((x) => x.id === r.partId) || { name: 'Onbekend', number: '', unit: 'stuks' };
        const n = map[r.partId] || 0;
        return `<div class="pick ${n >= r.qty ? 'done' : ''}">
          ${foto(p)}
          <div class="grow"><div class="nm">${esc(p.name)}</div>
            <div class="code">${esc(herkomst(p))}${p.geteld ? ` · ${p.vrij} vrij` : ''}</div></div>
          <div class="need">${r.qty}<small>nodig</small></div>
          <div class="step"><button data-act="pakmin:${r.partId}">−</button><span>${n}</span>
            <button data-act="pakplus:${r.partId}">+</button></div>
          <button class="tick ${n >= r.qty ? 'on' : ''}" data-act="pakvink:${r.partId}" aria-label="${esc(p.name)} gepakt">
            <svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9.5 17 4 11.5" stroke="currentColor" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>`;
      }).join('')}
      <div class="foot-actions">
        <span class="${compleet ? 'muted' : ''}">${compleet ? 'Alles afgevinkt.' : `Nog ${nodig - gepakt} stuks te gaan.`}</span>
        <div class="spacer"></div>
        <button class="btn lg" data-act="ermist">Er mist iets</button>
        <button class="btn gold lg" data-act="allesgepakt">Alles gepakt</button>
      </div>`;
  }

  function schermBestellen(ps) {
    const advies = teBestellen(ps);
    const onderweg = S.orders.filter((o) => o.status === 'open')
      .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    const binnen = S.orders.filter((o) => o.status === 'ontvangen')
      .sort((a, b) => (b.receivedAt || '').localeCompare(a.receivedAt || '')).slice(0, 6);
    const tekorten = ps.filter((p) => p.tekort > 0);

    const groepen = {};
    for (const p of advies) (groepen[p.supplier || 'Zonder leverancier'] ||= []).push(p);

    return `
      ${tekorten.length ? `<div class="note"><b>De werkplaats komt tekort:</b> ${tekorten
        .map((p) => `${p.tekort} × ${esc(p.name)}`).join(', ')}</div>` : ''}
      ${Object.keys(groepen).length ? Object.entries(groepen).map(([lev, lijst]) => `<section>
        <div class="head"><h2>${esc(lev)}</h2><div class="right faint">${lijst.length} onderdelen</div></div>
        <div class="scroll"><table><thead><tr>
          <th>Onderdeel</th><th class="num">Vrij</th><th class="num">Bestelpunt</th><th class="num">Tekort</th>
          <th class="num">Advies</th><th>Status</th><th></th></tr></thead>
        <tbody>${lijst.map((p) => `<tr>
          <td>${cel(p)}</td>
          <td class="num" style="font-weight:600">${p.vrij}</td>
          <td class="num faint">${p.minStock}</td>
          <td class="num">${p.tekort ? `<span class="chip order">${p.tekort}</span>` : '<span class="faint">–</span>'}</td>
          <td class="num mono">${p.advies}</td>
          <td>${CHIP[p.status]}</td>
          <td style="text-align:right;white-space:nowrap">
            ${p.tekort ? `<button class="link" data-act="afgehandeld:${p.id}">tekort afgehandeld</button> ` : ''}
            <button class="btn" data-act="bestel:${p.id}">Bestellen</button></td>
        </tr>`).join('')}</tbody></table></div></section>`).join('')
      : `<p class="empty">${ps.every((p) => p.status === 'onbekend')
        ? 'Vul eerst bij Onderdelen de voorraad en het bestelpunt in, dan rekent het programma hier uit wat er besteld moet worden.'
        : 'Er hoeft niets besteld te worden.'}</p>`}

      <section>
        <div class="head"><h2>Onderweg</h2><div class="right faint">besteld, nog niet binnen</div></div>
        ${onderweg.length ? `<div class="scroll"><table><thead><tr>
          <th>Onderdeel</th><th class="num">Aantal</th><th>Leverancier</th><th>Besteld</th><th></th></tr></thead>
          <tbody>${onderweg.map((o) => {
            const p = ps.find((x) => x.id === o.partId) || { name: 'Onbekend onderdeel', number: '', photo: '' };
            return `<tr><td>${cel(p)}</td><td class="num mono">${o.qty}</td>
              <td style="font-size:13.5px">${esc(o.supplier || '–')}</td>
              <td class="faint" style="font-size:13px">${datum(o.createdAt)} · ${esc(o.orderedBy || '')}</td>
              <td style="text-align:right;white-space:nowrap">
                <button class="link" data-act="annuleer:${o.id}">annuleren</button>
                <button class="btn gold" data-act="ontvangen:${o.id}" style="margin-left:8px">Ontvangen</button></td></tr>`;
          }).join('')}</tbody></table></div>` : '<p class="empty">Niets onderweg.</p>'}
      </section>

      ${binnen.length ? `<section><div class="head"><h2>Laatst ontvangen</h2></div>
        <div class="rows">${binnen.map((o) => {
          const p = ps.find((x) => x.id === o.partId) || { name: 'Onbekend onderdeel' };
          return `<div class="row"><div class="grow">${esc(p.name)}</div>
            <div class="mono">+${o.receivedQty || o.qty}</div>
            <div class="faint" style="font-size:13px;min-width:90px;text-align:right">${datum(o.receivedAt)}</div></div>`;
        }).join('')}</div></section>` : ''}`;
  }

  /* ------------------------------------------------------------ tekenen */

  function teken(force) {
    if (!force && document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
      S.hertekenen = true;
      return;
    }
    S.hertekenen = false;
    const view = document.getElementById('view');
    if (S.verbinding === 'geen') {
      view.innerHTML = `<p class="empty">De gedeelde gegevens zijn in deze weergave niet beschikbaar.
        Open de site via je eigen link, dan zie je de voorraad van de werkplaats.</p>`;
      tekenTabs();
      return;
    }
    if (!S.klaar) { view.innerHTML = '<p class="empty">Gegevens laden…</p>'; tekenTabs(); return; }

    const ps = onderdelen();
    const scherm = S.tab === 'onderdelen' ? schermOnderdelen(ps)
      : S.tab === 'kastlijsten' ? schermKastlijsten()
      : S.tab === 'pakken' ? schermPakken(ps)
      : S.tab === 'bestellen' ? schermBestellen(ps)
      : schermOverzicht(ps);
    view.innerHTML = scherm;
    tekenTabs();
  }

  function tekenTabs() {
    const ps = S.klaar ? onderdelen() : [];
    const tellers = {
      kastlijsten: openLijsten().length,
      pakken: openLijsten().length,
      bestellen: teBestellen(ps).filter((p) => p.status !== 'besteld').length,
    };
    document.getElementById('tabs').innerHTML = TABS.map(([k, t]) =>
      `<button data-act="tab:${k}" aria-current="${S.tab === k}">${t}${
        tellers[k] ? `<span class="count">${tellers[k]}</span>` : ''}</button>`).join('');
  }

  let toastTimer;
  function meld(tekst) {
    const t = document.getElementById('toast');
    t.textContent = tekst;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  }

  /* ------------------------------------------------------------ vensters */

  let venster = null;

  function toonVenster(titel, inhoud, knoppen, breed) {
    venster = { knoppen };
    document.getElementById('overlay').innerHTML = `<div class="veil" data-act="sluitveil">
      <div class="panel ${breed ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(titel)}">
        <div class="ph"><h2>${esc(titel)}</h2><button class="x" data-act="sluit" aria-label="Sluiten">×</button></div>
        <div class="pb">${inhoud}</div>
        <div class="pf">${knoppen.map((k, i) =>
          `<button class="btn ${k.stijl || ''}" data-act="venster:${i}">${esc(k.tekst)}</button>`).join('')}</div>
      </div></div>`;
    const eerste = document.querySelector('#overlay input, #overlay textarea, #overlay .btn');
    if (eerste) eerste.focus();
  }

  function sluit() {
    venster = null;
    document.getElementById('overlay').innerHTML = '';
  }

  const veld = (id, label, waarde, extra) =>
    `<label class="f"><span class="eyebrow">${label}</span>
      <input id="${id}" type="${(extra && extra.type) || 'text'}" value="${esc(waarde == null ? '' : waarde)}"
        ${extra && extra.plaats ? `placeholder="${esc(extra.plaats)}"` : ''}
        ${extra && extra.mode ? `inputmode="${extra.mode}"` : ''}></label>`;
  const waarde = (id) => (document.getElementById(id) || {}).value || '';
  const getal = (id) => Math.round(Number(waarde(id)) || 0);

  function vensterOnderdeel(p) {
    const gekozenFoto = { url: p ? p.photo || '' : '' };
    toonVenster(p ? 'Onderdeel wijzigen' : 'Nieuw onderdeel', `
      <div class="grid2">
        ${veld('f_number', 'Artikelnummer', p && p.number, { plaats: 'SCH-1101' })}
        ${veld('f_name', 'Naam', p && p.name, { plaats: 'Potscharnier 110° opdek' })}
        ${veld('f_category', 'Categorie', p && p.category, { plaats: 'Scharnieren' })}
        ${veld('f_unit', 'Eenheid', (p && p.unit) || 'stuks')}
        ${veld('f_supplier', 'Leverancier', p && p.supplier)}
        ${veld('f_location', 'Locatie', p && p.location, { plaats: 'A1-01' })}
        ${veld('f_stock', 'Voorraad', p ? p.stock : 0, { type: 'number' })}
        ${veld('f_min', 'Bestelpunt', p ? p.minStock : 0, { type: 'number' })}
        ${veld('f_order', 'Bestellen per', p ? p.orderQty : 0, { type: 'number' })}
        <label class="f wide"><span class="eyebrow">Opmerking</span>
          <textarea id="f_notes">${esc((p && p.notes) || '')}</textarea></label>
        <div class="wide">
          <span class="eyebrow">Foto</span>
          <div style="display:flex;gap:12px;align-items:center;margin-top:6px">
            <img id="f_preview" class="thumb" style="width:70px;height:54px" src="${esc(gekozenFoto.url || LEEG)}" alt="">
            <input id="f_file" type="file" accept="image/*" style="font-size:12.5px">
          </div>
        </div>
      </div>`, [
      { tekst: 'Annuleren' },
      { tekst: p ? 'Opslaan' : 'Toevoegen', stijl: 'solid', doe: async () => {
        const body = {
          number: waarde('f_number').trim(), name: waarde('f_name').trim(),
          category: waarde('f_category').trim(), unit: waarde('f_unit').trim() || 'stuks',
          supplier: waarde('f_supplier').trim(), location: waarde('f_location').trim(),
          stock: Math.max(0, getal('f_stock')), minStock: Math.max(0, getal('f_min')),
          orderQty: Math.max(0, getal('f_order')), notes: waarde('f_notes').trim(),
          photo: gekozenFoto.url, geteld: true,
        };
        if (!body.name || !body.number) { meld('Vul een naam en een artikelnummer in.'); return false; }
        const dubbel = S.parts.some((x) => x.number.toLowerCase() === body.number.toLowerCase() && (!p || x.id !== p.id));
        if (dubbel) { meld('Dit artikelnummer bestaat al.'); return false; }
        await schrijf(async () => {
          if (p) { await S.db.doc('parts/' + p.id).set({ ...p, ...body }); await logboek(`${body.number} gewijzigd`); }
          else { await S.db.collection('parts').add({ ...body, createdAt: nu() }); await logboek(`${body.number} – ${body.name} toegevoegd`); }
        }, p ? 'Onderdeel bijgewerkt' : 'Onderdeel toegevoegd');
        return true;
      } },
    ], true);

    const file = document.getElementById('f_file');
    if (file) file.addEventListener('change', async () => {
      const b = file.files && file.files[0];
      if (!b) return;
      try {
        const url = S.assets ? (await S.assets.upload(b)).url : await verkleindeFoto(b);
        gekozenFoto.url = url;
        document.getElementById('f_preview').src = url;
        meld('Foto toegevoegd');
      } catch (e) { meld('De foto kon niet opgeslagen worden.'); }
    });
  }

  function vensterBestellen(p) {
    toonVenster('Bestellen', `
      <p><b>${esc(p.name)}</b><br><span class="code">${esc(p.number)}</span></p>
      <p class="muted" style="font-size:13.5px">${p.vrij} vrij · bestelpunt ${p.minStock}${
        p.tekort ? ` · ${p.tekort} tekort gemeld` : ''}${p.besteld ? ` · ${p.besteld} al onderweg` : ''}</p>
      <div class="grid2">
        ${veld('b_qty', 'Aantal', p.advies, { type: 'number' })}
        ${veld('b_sup', 'Leverancier', p.supplier)}
        ${veld('b_note', 'Opmerking', '', { plaats: 'bijv. spoed' })}
      </div>`, [
      { tekst: 'Annuleren' },
      { tekst: 'Bestelling opslaan', stijl: 'solid', doe: async () => {
        const qty = getal('b_qty');
        if (qty <= 0) { meld('Vul een aantal in.'); return false; }
        await schrijf(async () => {
          await S.db.collection('orders').add({
            partId: p.id, qty, supplier: waarde('b_sup').trim(), note: waarde('b_note').trim(),
            status: 'open', orderedBy: S.wie, createdAt: nu(), receivedQty: 0, receivedAt: null,
          });
          await logboek(`${qty} × ${p.name} besteld`);
        }, 'Bestelling genoteerd');
        return true;
      } },

  }

  function vensterOntvangen(o, p) {
    toonVenster('Bestelling ontvangen', `
      <p><b>${esc(p ? p.name : 'Onderdeel')}</b></p>
      ${veld('o_qty', 'Hoeveel is er binnengekomen?', o.qty, { type: 'number' })}
      <p class="faint" style="font-size:13px">Dit aantal wordt bij de voorraad opgeteld.</p>`, [
      { tekst: 'Annuleren' },
      { tekst: 'Bijboeken', stijl: 'gold', doe: async () => {
        const qty = getal('o_qty');
        if (qty <= 0) { meld('Vul een aantal in.'); return false; }
        await schrijf(async () => {
          if (p) await partRef(p.id).update({ stock: (p.stock || 0) + qty, geteld: true });
          await S.db.doc('orders/' + o.id).update({ status: 'ontvangen', receivedQty: qty, receivedAt: nu() });
          if (p) await wisTekort(p.id);
          await logboek(`${qty} × ${p ? p.name : 'onderdeel'} ontvangen`);
        }, 'Voorraad bijgewerkt');
        return true;
      } },
    ]);
  }

  function vensterTellen(p) {
    toonVenster('Voorraad tellen', `
      <p><b>${esc(p.name)}</b><br><span class="code">${esc(p.number)}</span></p>
      ${veld('t_qty', 'Werkelijk aantal in het magazijn', p.stock, { type: 'number' })}`, [
      { tekst: 'Annuleren' },
      { tekst: 'Opslaan', stijl: 'solid', doe: async () => {
        const qty = Math.max(0, getal('t_qty'));
        await schrijf(async () => {
          await partRef(p.id).update({ stock: qty, geteld: true });
          await logboek(`Voorraad ${p.number} geteld: ${p.stock} → ${qty}`);
        }, 'Voorraad bijgewerkt');
        return true;
      } },
    ]);
  }

  function vensterMist(l, ps) {
    const map = S.gepakt.map;
    const mist = (l.lines || []).map((r) => ({ r, n: Math.max(0, r.qty - (map[r.partId] || 0)) })).filter((x) => x.n > 0);
    if (!mist.length) { meld('Er mist niets — rond af met "Alles gepakt".'); return; }
    toonVenster('Wat mist er?', `
      <p class="muted" style="font-size:13.5px">Dit geven we door aan Roy zodat hij kan bijbestellen.
        Klopt het niet? Zet het aantal dan eerst goed in de lijst.</p>
      <div class="rows">${mist.map(({ r, n }) => {
        const p = ps.find((x) => x.id === r.partId) || { name: 'Onbekend' };
        return `<div class="row"><div class="grow">${esc(p.name)}
          <div class="code">${r.qty} nodig · ${map[r.partId] || 0} gepakt</div></div>
          <span class="chip order">${n} mist</span></div>`;
      }).join('')}</div>`, [
      { tekst: 'Terug naar de lijst' },
      { tekst: 'Tekort doorgeven', stijl: 'solid', doe: async () => { await rondAf(l, false, ps); return true; } },
    ], true);
  }

  /** Maakt een gekozen foto klein genoeg om op dit apparaat te bewaren. */
  function verkleindeFoto(bestand) {
    return new Promise((klaar, fout) => {
      const lezer = new FileReader();
      lezer.onerror = () => fout(new Error('lezen mislukt'));
      lezer.onload = () => {
        const beeld = new Image();
        beeld.onerror = () => fout(new Error('geen afbeelding'));
        beeld.onload = () => {
          const schaal = Math.min(1, 800 / (beeld.width || 800));
          const doek = document.createElement('canvas');
          doek.width = Math.round(beeld.width * schaal);
          doek.height = Math.round(beeld.height * schaal);
          doek.getContext('2d').drawImage(beeld, 0, 0, doek.width, doek.height);
          klaar(doek.toDataURL('image/jpeg', 0.72));
        };
        beeld.src = lezer.result;
      };
      lezer.readAsDataURL(bestand);
    });
  }

  /* ------------------------------------------------------------ acties */

  async function wisTekort(partId) {
    for (const l of S.lists) {
      let raak = false;
      const lines = (l.lines || []).map((r) => {
        if (r.partId === partId && r.missingQty > 0 && !r.missingHandled) { raak = true; return { ...r, missingHandled: true }; }
        return r;
      });
      if (raak) await listRef(l.id).update({ lines });
    }
  }

  async function rondAf(l, compleet, ps) {
    const map = S.gepakt.map;
    const lines = (l.lines || []).map((r) => {
      const n = compleet ? r.qty : Math.min(map[r.partId] || 0, r.qty);
      return { ...r, pickedQty: n, missingQty: Math.max(0, r.qty - n), missingHandled: false };
    });
    const mist = lines.filter((r) => r.missingQty > 0);
    await schrijf(async () => {
      for (const r of lines) {
        if (r.pickedQty > 0) {
          const p = S.parts.find((x) => x.id === r.partId);
          if (p) await partRef(p.id).update({ stock: Math.max(0, (p.stock || 0) - r.pickedQty) });
        }
      }
      await listRef(l.id).update({
        lines, status: mist.length ? 'tekort' : 'gepakt', completedBy: S.wie, completedAt: nu(),
      });
      if (mist.length) {
        const tekst = mist.map((r) => {
          const p = ps.find((x) => x.id === r.partId);
          return `${r.missingQty} × ${p ? p.name : 'onderdeel'}`;
        }).join(', ');
        await logboek(`Kast ${l.cabinetNumber}: tekort gemeld — ${tekst}`);
      } else {
        await logboek(`Kast ${l.cabinetNumber} compleet gepakt`);
      }
    });
    S.gepakt = null;
    S.tab = 'pakken';
    meld(mist.length ? 'Tekort doorgegeven aan Roy' : 'Kast compleet gepakt');
    teken(true);
  }

  async function doeActie(act) {
    const [naam, a, b] = act.split(':');
    const ps = onderdelen();
    const part = (id) => ps.find((p) => p.id === id);

    if (naam === 'tab') { S.tab = a; S.open = null; S.lijst = null; S.concept = null; S.zoek = ''; S.filter = 'alles'; return teken(true); }
    if (naam === 'filter') { S.filter = a; return teken(true); }
    if (naam === 'toon') { S.open = S.open === a ? null : a; return teken(true); }
    if (naam === 'terug') { S.lijst = null; S.concept = null; S.tab = 'kastlijsten'; return teken(true); }

    if (naam === 'nieuwonderdeel') return vensterOnderdeel(null);
    if (naam === 'wijzig') return vensterOnderdeel(part(a));
    if (naam === 'bestel') return vensterBestellen(part(a));
    if (naam === 'tellen') return vensterTellen(part(a));
    if (naam === 'voorraad') {
      const p = part(a);
      return schrijf(async () => {
        const nieuw = Math.max(0, (p.stock || 0) + Number(b));
        await partRef(p.id).update({ stock: nieuw, geteld: true });
        await logboek(`Voorraad ${p.number}: ${p.stock} → ${nieuw}`);
      });
    }
    if (naam === 'afgehandeld') {
      return schrijf(async () => { await wisTekort(a); await logboek(`Tekort ${part(a).name} afgehandeld`); }, 'Tekort afgehandeld');
    }
    if (naam === 'ontvangen') {
      const o = S.orders.find((x) => x.id === a);
      return vensterOntvangen(o, part(o.partId));
    }
    if (naam === 'annuleer') {
      return schrijf(async () => { await S.db.doc('orders/' + a).delete(); await logboek('Bestelling geannuleerd'); }, 'Bestelling verwijderd');
    }

    if (naam === 'lijst') { S.tab = 'kastlijsten'; S.lijst = a; return teken(true); }
    if (naam === 'nieuwelijst') {
      S.tab = 'kastlijsten'; S.lijst = null;
      S.concept = { id: null, cabinetNumber: '', title: '', note: '', lines: [], zoek: '' };
      return teken(true);
    }
    if (naam === 'wijziglijst') {
      const l = S.lists.find((x) => x.id === a);
      S.concept = { id: l.id, cabinetNumber: l.cabinetNumber, title: l.title || '', note: l.note || '',
        lines: (l.lines || []).map((r) => ({ partId: r.partId, qty: r.qty })), zoek: '' };
      S.lijst = null;
      return teken(true);
    }
    if (naam === 'verwijderlijst') {
      return schrijf(async () => {
        const l = S.lists.find((x) => x.id === a);
        await listRef(a).delete();
        await logboek(`Kastlijst ${l ? l.cabinetNumber : ''} verwijderd`);
        S.lijst = null;
        teken(true);
      }, 'Kastlijst verwijderd');
    }
    if (naam === 'conceptadd') {
      const r = S.concept.lines.find((x) => x.partId === a);
      if (r) r.qty += 1; else S.concept.lines.push({ partId: a, qty: 1 });
      return teken(true);
    }
    if (naam === 'conceptplus') { S.concept.lines.find((x) => x.partId === a).qty += 1; return teken(true); }
    if (naam === 'conceptmin') {
      const r = S.concept.lines.find((x) => x.partId === a);
      r.qty -= 1;
      if (r.qty <= 0) S.concept.lines = S.concept.lines.filter((x) => x.partId !== a);
      return teken(true);
    }
    if (naam === 'conceptweg') { S.concept.lines = S.concept.lines.filter((x) => x.partId !== a); return teken(true); }
    if (naam === 'bewaarlijst') {
      const c = S.concept;
      c.cabinetNumber = waarde('kastnr').trim() || c.cabinetNumber;
      c.title = waarde('kasttitel').trim();
      if (!c.cabinetNumber) { meld('Vul het kastnummer in.'); return; }
      if (!c.lines.length) { meld('Zet minimaal één onderdeel op de lijst.'); return; }
      return schrijf(async () => {
        if (c.id) {
          const oud = S.lists.find((x) => x.id === c.id);
          const lines = c.lines.map((r) => {
            const bestaand = (oud.lines || []).find((x) => x.partId === r.partId) || {};
            return { partId: r.partId, qty: r.qty, pickedQty: bestaand.pickedQty || 0, missingQty: 0, missingHandled: false };
          });
          await listRef(c.id).update({ cabinetNumber: c.cabinetNumber, title: c.title, lines });
          await logboek(`Kastlijst ${c.cabinetNumber} aangepast`);
          S.lijst = c.id;
        } else {
          const ref = await S.db.collection('lists').add({
            cabinetNumber: c.cabinetNumber, title: c.title, note: '',
            status: 'open', createdBy: S.wie, createdAt: nu(),
            completedBy: null, completedAt: null,
            lines: c.lines.map((r) => ({ partId: r.partId, qty: r.qty, pickedQty: 0, missingQty: 0, missingHandled: false })),
          });
          await logboek(`Kastlijst ${c.cabinetNumber} aangemaakt (${c.lines.length} onderdelen)`);
          S.lijst = ref.id;
        }
        S.concept = null;
        teken(true);
      }, 'Kastlijst opgeslagen');
    }

    if (naam === 'pak') {
      const l = S.lists.find((x) => x.id === a);
      const map = {};
      for (const r of l.lines || []) map[r.partId] = r.pickedQty || 0;
      S.gepakt = { listId: l.id, map };
      S.tab = 'pakken';
      S.lijst = null;
      teken(true);
      if (l.status === 'open') schrijf(() => listRef(l.id).update({ status: 'bezig', startedBy: S.wie, startedAt: nu() }));
      return;
    }
    if (naam === 'stoppakken') { S.gepakt = null; return teken(true); }
    if (naam === 'pakvink' || naam === 'pakplus' || naam === 'pakmin') {
      const l = S.lists.find((x) => x.id === S.gepakt.listId);
      const r = (l.lines || []).find((x) => x.partId === a);
      const huidig = S.gepakt.map[a] || 0;
      S.gepakt.map[a] = naam === 'pakvink' ? (huidig >= r.qty ? 0 : r.qty)
        : naam === 'pakplus' ? Math.min(r.qty, huidig + 1) : Math.max(0, huidig - 1);
      return teken(true);
    }
    if (naam === 'allesgepakt') {
      const l = S.lists.find((x) => x.id === S.gepakt.listId);
      for (const r of l.lines || []) S.gepakt.map[r.partId] = r.qty;
      return rondAf(l, true, ps);
    }
    if (naam === 'ermist') {
      const l = S.lists.find((x) => x.id === S.gepakt.listId);
      return vensterMist(l, ps);
    }

    if (naam === 'exporteer') {
      const blob = new Blob([JSON.stringify(S.db.alles(), null, 1)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'onderdelenbeheer-' + new Date().toISOString().slice(0, 10) + '.json';
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 4000);
      return meld('Bestand opgeslagen');
    }
    if (naam === 'importeer') {
      const invoer = document.createElement('input');
      invoer.type = 'file';
      invoer.accept = 'application/json,.json';
      invoer.addEventListener('change', async () => {
        const bestand = invoer.files && invoer.files[0];
        if (!bestand) return;
        try {
          S.db.vervangAlles(JSON.parse(await bestand.text()));
          meld('Gegevens ingelezen');
        } catch (e) { meld('Dit bestand kon niet gelezen worden.'); }
      });
      invoer.click();
      return;
    }
    if (naam === 'sluit' || naam === 'sluitveil') return sluit();
    if (naam === 'venster') {
      const knop = venster.knoppen[Number(a)];
      if (!knop.doe) return sluit();
      const klaar = await knop.doe();
      if (klaar !== false) sluit();
      return;
    }
  }

  /* ------------------------------------------------------------ luisteren */

  document.addEventListener('click', (e) => {
    const knop = e.target.closest('[data-act]');
    if (!knop) return;
    if (knop.classList.contains('veil') && e.target !== knop) return;
    e.preventDefault();
    doeActie(knop.dataset.act);
  });

  document.addEventListener('input', (e) => {
    if (e.target.id === 'zoek') {
      S.zoek = e.target.value;
      const doel = document.getElementById('onderdelenlijst');
      const past = (p) => S.filter === 'alles' ? true
        : S.filter === 'bestellen' ? (p.status === 'bestellen' || p.status === 'op')
        : S.filter === 'onbekend' ? p.status === 'onbekend' : p.status === 'ok';
      if (doel) doel.innerHTML = tabelOnderdelen(zoeken(S.zoek, onderdelen().filter(past)));
    } else if (e.target.id === 'zoeklijst') {
      S.zoek = e.target.value;
      const doel = document.getElementById('lijstrijen');
      const q = S.zoek.trim().toLowerCase();
      if (doel) doel.innerHTML = S.lists.slice()
        .sort((x, y) => (y.createdAt || '').localeCompare(x.createdAt || ''))
        .filter((l) => `${l.cabinetNumber} ${l.title}`.toLowerCase().includes(q))
        .map((l) => rijLijst(l)).join('');
    } else if (e.target.id === 'conceptzoek' && S.concept) {
      S.concept.zoek = e.target.value;
      const doel = document.getElementById('conceptresultaat');
      if (doel) {
        doel.innerHTML = zoeken(S.concept.zoek, onderdelen()).slice(0, 25).map((p) => `<div class="row">
          ${foto(p)}<div class="grow"><div class="name">${esc(p.name)}</div>
            <div class="code">${esc(kort(p))} · ${p.geteld ? p.vrij + ' vrij' : 'nog niet geteld'}</div></div>
          <button class="btn" data-act="conceptadd:${p.id}">Toevoegen</button></div>`).join('');
      }
    } else if (e.target.id === 'kastnr' && S.concept) {
      S.concept.cabinetNumber = e.target.value;
    } else if (e.target.id === 'kasttitel' && S.concept) {
      S.concept.title = e.target.value;
    }
  });

  document.addEventListener('focusout', () => {
    setTimeout(() => {
      if (S.hertekenen && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) teken(true);
    }, 60);
  });

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && venster) sluit(); });

  const kies = document.getElementById('who');
  kies.innerHTML = MENSEN.map((m) => `<option ${m === S.wie ? 'selected' : ''}>${m}</option>`).join('');
  kies.addEventListener('change', () => {
    S.wie = kies.value;
    try { localStorage.setItem('wie', S.wie); } catch (err) { /* privémodus */ }
    if (S.wie === 'Dean') { S.tab = 'pakken'; S.lijst = null; S.concept = null; }
    teken(true);
  });

  teken(true);
  start();
})();
</script>
</body>
</html>
