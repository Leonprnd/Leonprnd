<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="t4 d4">
  <title id="t4">De afmetingen: 21 centimeter breed en 5 centimeter hoog</title>
  <desc id="d4">Maatvoering van de pillendoos naast een gewone koffiemok. De doos is 21 centimeter in doorsnee, 5 centimeter hoog en weegt 610 gram.</desc>
  <defs>
    <radialGradient id="doek" cx="42%" cy="28%" r="80%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eee7dc"/>
    </radialGradient>
    <linearGradient id="romp" x1="16%" y1="0%" x2="84%" y2="100%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#f4f6f8"/>
      <stop offset="1" stop-color="#dae0e6"/>
    </linearGradient>
    <linearGradient id="wand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#b6bfc8"/><stop offset=".24" stop-color="#e8ecef"/>
      <stop offset=".58" stop-color="#ccd4db"/><stop offset="1" stop-color="#a7b1bb"/>
    </linearGradient>
    <linearGradient id="mok" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#b8d4cd"/><stop offset=".3" stop-color="#e4f0ed"/>
      <stop offset=".72" stop-color="#cbe0da"/><stop offset="1" stop-color="#9dbdb4"/>
    </linearGradient>
    <filter id="zacht" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="bak" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#14212e" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#doek)"/>

  <!-- Maatlijn voor de doorsnede, boven het product. -->
  <g stroke="#0f6b5c" stroke-width="2.5" fill="none">
    <path d="M118 196v-46M482 196v-46"/>
    <path d="M118 173h364"/>
    <path d="M118 173l18-9v18zM482 173l-18-9v18z" fill="#0f6b5c" stroke="none"/>
  </g>
  <rect x="242" y="152" width="116" height="42" rx="10" fill="#fbf7f1"/>
  <text x="300" y="181" text-anchor="middle" font-family="Arial,sans-serif" font-size="25"
        font-weight="700" fill="#0f6b5c">21 cm</text>

  <ellipse cx="300" cy="474" rx="208" ry="34" fill="#9a8f7f" opacity=".4" filter="url(#zacht)"/>

  <!-- Het apparaat van opzij, zodat de hoogte klopt met de maatlijn. -->
  <g filter="url(#bak)">
    <path d="M118 366a182 40 0 0 0 364 0v66a182 40 0 0 1-364 0z" fill="url(#wand)"/>
    <ellipse cx="300" cy="366" rx="182" ry="40" fill="url(#romp)"/>
    <ellipse cx="300" cy="366" rx="182" ry="40" fill="none" stroke="#a5afb9" stroke-width="2.5"/>
    <ellipse cx="300" cy="360" rx="160" ry="33" fill="none" stroke="#c9d1d8" stroke-width="2.5"/>
  </g>
  <rect x="246" y="410" width="108" height="34" rx="9" fill="#1f2a22"/>
  <rect x="252" y="415" width="96" height="24" rx="6" fill="#5d7a63"/>
  <text x="300" y="434" text-anchor="middle" font-family="'Courier New',monospace"
        font-size="19" font-weight="700" fill="#101a12" letter-spacing="2">08:00</text>

  <!-- Maatlijn voor de hoogte, rechts van het product. -->
  <g stroke="#0f6b5c" stroke-width="2.5" fill="none">
    <path d="M482 366h64M482 432h64"/>
    <path d="M528 366v66"/>
    <path d="M528 366l-9 16h18zM528 432l-9-16h18z" fill="#0f6b5c" stroke="none"/>
  </g>
  <rect x="546" y="378" width="96" height="42" rx="10" fill="#fbf7f1"/>
  <text x="594" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="25"
        font-weight="700" fill="#0f6b5c">5 cm</text>

  <!-- Koffiemok als vertrouwd ijkpunt: zo groot is het dus echt. -->
  <g filter="url(#bak)" transform="translate(702 314) scale(.86)">
    <ellipse cx="0" cy="182" rx="56" ry="13" fill="#9a8f7f" opacity=".34" filter="url(#zacht)"/>
    <path d="M44 84c30 0 44 16 44 34s-14 34-44 34" fill="none" stroke="#a9c6be" stroke-width="13"/>
    <path d="M-46 62h92v92a26 26 0 0 1-26 26h-40a26 26 0 0 1-26-26z" fill="url(#mok)"/>
    <ellipse cx="0" cy="62" rx="46" ry="14" fill="#f3faf8" stroke="#a9c6be" stroke-width="2"/>
    <ellipse cx="0" cy="62" rx="36" ry="10" fill="#6b4a2f"/>
  </g>
  <text x="702" y="524" text-anchor="middle" font-family="Arial,sans-serif" font-size="16"
        fill="#6e8093">gewone koffiemok</text>

  <!-- Harde cijfers onderaan: de vragen die de klantenservice anders krijgt. -->
  <g>
    <rect x="96" y="580" width="608" height="120" rx="18" fill="#ffffff" stroke="#e6ded2" stroke-width="2"/>
    <g font-family="Arial,sans-serif" text-anchor="middle">
      <text x="217" y="630" font-size="30" font-weight="700" fill="#14212e">610 g</text>
      <text x="217" y="660" font-size="16" fill="#6e8093">met batterijen</text>
      <text x="400" y="630" font-size="30" font-weight="700" fill="#14212e">28</text>
      <text x="400" y="660" font-size="16" fill="#6e8093">vakjes</text>
      <text x="583" y="630" font-size="30" font-weight="700" fill="#14212e">24 st.</text>
      <text x="583" y="660" font-size="16" fill="#6e8093">pillen per vakje</text>
    </g>
    <path d="M308 606v70M492 606v70" stroke="#e6ded2" stroke-width="2"/>
  </g>
</svg>
