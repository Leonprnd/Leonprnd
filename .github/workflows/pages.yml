# Zet de website online op GitHub Pages.
# Nodig als bij Settings → Pages de bron "GitHub Actions" is gekozen.
name: Website publiceren

on:
  push:
    branches: [claude/furniture-parts-inventory-afpzji]
    paths: ['site/**', 'docs/**', 'scripts/bouw-site.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publiceren:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicatie.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: publicatie
        uses: actions/deploy-pages@v4
