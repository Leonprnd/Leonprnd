# Zet de website online op GitHub Pages zodra er iets verandert in docs/.
name: Website publiceren

on:
  push:
    branches: [claude/furniture-parts-inventory-afpzji]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publiceren:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicatie.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: publicatie
        uses: actions/deploy-pages@v4
