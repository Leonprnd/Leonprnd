<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Onderdelenbeheer</title>
    <meta name="description" content="Voorraad, kastlijsten en bestellingen voor meubelonderdelen." />
    <link rel="icon" href="/img/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <a class="brand" href="#/overzicht">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect x="3" y="4" width="26" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M16 4v24" stroke="currentColor" stroke-width="2" />
            <circle cx="12.5" cy="16" r="1.6" fill="currentColor" />
            <circle cx="19.5" cy="16" r="1.6" fill="currentColor" />
          </svg>
          <span>Onderdelen<strong>beheer</strong></span>
        </a>
        <nav id="nav" class="nav" aria-label="Hoofdmenu"></nav>
        <div class="sidebar-foot">
          <label class="mini-label" for="user-select">Ingelogd als</label>
          <select id="user-select" class="select"></select>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          </button>
          <div id="page-title" class="page-title"></div>
          <div class="topbar-right">
            <span id="sync-state" class="sync" title="Gegevens worden automatisch bijgewerkt"></span>
          </div>
        </header>
        <main id="view" class="view" tabindex="-1"></main>
      </div>
    </div>

    <div id="modal-host"></div>
    <div id="toast-host" class="toast-host" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
